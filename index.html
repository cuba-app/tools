<script>
(function(){
const $ = s => document.querySelector(s);
const svg = (p, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

const TOOLS = [
  { id:'texto', name:'Ferramentas de texto', desc:'Contador, lorem ipsum, símbolos, maiúsculas, número por extenso e mais.',
    color:'linear-gradient(180deg,#6E6CF0,#5856D6)', icon:'<text x="12" y="16.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor" stroke="none" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Segoe UI,Roboto,Arial,sans-serif" letter-spacing="-.3">Aa</text>' },
  { id:'whatsapp', name:'Link WhatsApp', desc:'Links wa.me com mensagem pronta, QR Code e rastreamento.',
    color:'linear-gradient(180deg,#4CD964,#28B446)', icon:'<path d="M20.5 11.6a8.4 8.4 0 0 1-12.4 7.3L3.5 20.5l1.6-4.4a8.4 8.4 0 1 1 15.4-4.5z"/><path d="M9 9.2c.3 2.6 2.4 4.8 5.2 5.4l1-1.3-1.6-.9-.8.6a4 4 0 0 1-1.9-1.9l.6-.8-.9-1.6z" fill="currentColor" stroke-width="1.2"/>' },
  { id:'qrcode', name:'QR Code', desc:'QR Codes estáticos e personalizados para link, Wi‑Fi, Pix, WhatsApp e mais.',
    color:'linear-gradient(180deg,#C36CF0,#A445D6)', icon:'<rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5"/><path d="M14 14h2.5v2.5H14zM18 18h2.5v2.5H18zM14 19v1.5M20.5 14v1.5"/>' },
  { id:'senha', name:'Gerador de senhas', desc:'Gere senhas fortes e verifique a força das que você já usa.',
    color:'linear-gradient(180deg,#FFAA33,#FF8A00)', icon:'<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M17 6l2.5 2.5M14.5 8.5l2 2"/>' },
  { id:'utm', name:'Gerador de UTM', desc:'Links rastreáveis para o GA4, um por vez ou em lote, com histórico.',
    color:'linear-gradient(180deg,#2F95FF,#0A6CFF)', icon:'<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>' }
];
const HOME = { id:'', name:'Início', desc:'Todas as ferramentas', color:'linear-gradient(180deg,#00D2FF,#00E8FF)',
  icon:'<path d="M12 2.5c.9 5.2 4.3 8.6 9.5 9.5-5.2.9-8.6 4.3-9.5 9.5-.9-5.2-4.3-8.6-9.5-9.5 5.2-.9 8.6-4.3 9.5-9.5z" fill="currentColor" stroke="none"/>' };
const CHEV = '<path d="m9 5 7 7-7 7"/>';
const CHECK = '<path d="m5 12.5 4.5 4.5L19 7.5"/>';

/* ---------- Início ---------- */
$('#grid').innerHTML = TOOLS.map(t => `
  <a class="card" href="#/${t.id}">
    <div class="top"><span class="ic" style="background:${t.color}">${svg(t.icon, 1.9)}</span><span class="go"><span>Abrir</span>${svg(CHEV, 2.2)}</span></div>
    <div class="tx"><h2>${t.name}</h2><p>${t.desc}</p></div>
  </a>`).join('');

/* ---------- Menu ---------- */
const item = t => `<a class="mi" role="menuitem" href="#/${t.id}" data-id="${t.id}">
  <span class="ic" style="background:${t.color}">${svg(t.icon, 2)}</span>
  <span class="tx"><b>${t.name}</b><small>${t.desc}</small></span>${svg(CHECK, 2.4).replace('<svg', '<svg class="ck"')}</a>`;
$('#menuList').innerHTML = item(HOME) + '<hr>' + TOOLS.map(item).join('');

const menu = $('#menu'), scrim = $('#scrim'), menuBtn = $('#menuBtn');
function openMenu(){
  menu.hidden = false; scrim.hidden = false; menuBtn.setAttribute('aria-expanded', 'true');
  const cur = menu.querySelector('[aria-current="page"]') || menu.querySelector('.mi');
  cur && cur.focus({ preventScroll:true });
}
function closeMenu(focusBtn){
  if (menu.hidden) return;
  menu.hidden = true; scrim.hidden = true; menuBtn.setAttribute('aria-expanded', 'false');
  if (focusBtn) menuBtn.focus();
}
menuBtn.addEventListener('click', () => menu.hidden ? openMenu() : closeMenu());
scrim.addEventListener('click', () => closeMenu());
menu.addEventListener('click', e => { if (e.target.closest('.mi')) closeMenu(); });
menu.addEventListener('keydown', e => {
  const items = [...menu.querySelectorAll('.mi')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown'){ e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if (e.key === 'Tab'){ closeMenu(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu(true);
  if (e.altKey && !e.ctrlKey && !e.metaKey && /^Digit[0-5]$/.test(e.code)){
    e.preventDefault(); const n = +e.code.slice(5); location.hash = '#/' + (n ? TOOLS[n - 1].id : '');
  }
});
window.addEventListener('message', e => { if (e.data && e.data.honra === 'esc') closeMenu(true); });

/* ---------- Tema ---------- */
const THEME_ICON = {
  auto:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/>',
  light:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  dark:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>'
};
const THEME_NAME = { auto:'automático', light:'claro', dark:'escuro' };
const store = {
  get(k, d){ try { const v = localStorage.getItem('honra:' + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('honra:' + k, JSON.stringify(v)); } catch(e){} }
};
const mq = matchMedia('(prefers-color-scheme: dark)');
let theme = store.get('theme', 'auto');
if (!THEME_NAME[theme]) theme = 'auto';
const frames = {};
function applyTheme(){
  window.__honraMode = theme;
  const root = document.documentElement;
  if (theme === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = theme;
  const dark = theme === 'dark' || (theme === 'auto' && mq.matches);
  $('#metaTheme').setAttribute('content', dark ? '#161618' : '#F6F6F8');
  const b = $('#themeBtn'); b.innerHTML = svg(THEME_ICON[theme], 2); b.title = 'Tema: ' + THEME_NAME[theme];
  b.setAttribute('aria-label', 'Tema ' + THEME_NAME[theme] + '. Toque para trocar.');
  Object.values(frames).forEach(f => { try { f.contentWindow.__honraTheme && f.contentWindow.__honraTheme(theme); } catch(e){} });
}
$('#themeBtn').addEventListener('click', () => {
  theme = { auto:'light', light:'dark', dark:'auto' }[theme];
  store.set('theme', theme); applyTheme(); toast('Tema ' + THEME_NAME[theme]);
});
mq.addEventListener && mq.addEventListener('change', applyTheme);
applyTheme();

let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600); }

/* ---------- Rotas ---------- */
const stage = $('#stage'), home = $('#home'), loader = $('#loader');
function frameFor(t){
  if (frames[t.id]) return frames[t.id];
  const f = document.createElement('iframe');
  f.title = t.name;
  f.setAttribute('allow', 'clipboard-read; clipboard-write; web-share; fullscreen');
  f.className = 'off';
  loader.hidden = false;
  f.addEventListener('load', () => {
    try { f.contentWindow.__honraTheme && f.contentWindow.__honraTheme(theme); } catch(e){}
    if (current === t.id) loader.hidden = true;
  });
  f.srcdoc = TOOL_SRC[t.id];
  stage.appendChild(f);
  frames[t.id] = f;
  return f;
}
let current = null;
function route(){
  const id = (location.hash.match(/^#\/?([\w-]*)/) || [])[1] || '';
  const t = TOOLS.find(x => x.id === id);
  current = t ? t.id : '';
  closeMenu();
  menu.querySelectorAll('.mi').forEach(m => m.setAttribute('aria-current', m.dataset.id === current ? 'page' : 'false'));
  const ic = $('#barIc');
  if (!t){
    stage.hidden = true; home.hidden = false; document.body.classList.remove('in-tool');
    $('#barTitle').textContent = 'Início'; ic.hidden = true;
    document.title = 'Honra · Ferramentas';
    Object.values(frames).forEach(f => { f.classList.add('off'); f.setAttribute('inert', ''); });
    return;
  }
  home.hidden = true; stage.hidden = false; document.body.classList.add('in-tool');
  $('#barTitle').textContent = t.name;
  ic.hidden = false; ic.style.background = t.color; ic.innerHTML = svg(t.icon, 2.1);
  document.title = t.name + ' · Honra';
  const f = frameFor(t);
  Object.values(frames).forEach(x => {
    const on = x === f; x.classList.toggle('off', !on);
    if (on) x.removeAttribute('inert'); else x.setAttribute('inert', '');
  });
  loader.hidden = !!(f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentDocument.body && f.contentDocument.body.childElementCount);
}
window.addEventListener('hashchange', route);
route();
window.scrollTo(0, 0);
})();
</script>
