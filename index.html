<style>
:root{
  --bg:#F2F2F7; --bg2:#FFFFFF; --bg3:#F2F2F7;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.2);
  --blue:#007AFF; --chrome:rgba(246,246,248,.8); --toast:rgba(255,255,255,.94);
  --shadow:0 0 0 .5px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05);
  --pop:0 0 0 .5px rgba(0,0,0,.06),0 12px 40px rgba(0,0,0,.16);
  --glow:rgba(0,214,255,.16);
  --barh:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg2:#1C1C1E; --bg3:#2C2C2E;
    --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34);
    --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.62);
    --blue:#0A84FF; --chrome:rgba(22,22,24,.8); --toast:rgba(44,44,46,.96);
    --shadow:none; --pop:0 0 0 .5px rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.6);
    --glow:rgba(0,214,255,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#1C1C1E; --bg3:#2C2C2E;
  --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.62);
  --blue:#0A84FF; --chrome:rgba(22,22,24,.8); --toast:rgba(44,44,46,.96);
  --shadow:none; --pop:0 0 0 .5px rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.6);
  --glow:rgba(0,214,255,.12);
  color-scheme:dark;
}
@media (max-width:640px){ :root{ --barh:52px; } }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(var(--barh) + env(safe-area-inset-top,0px));background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--label);font-size:15px;line-height:1.4;letter-spacing:-.01em;min-height:100%;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
body.in-tool{overflow:hidden}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:10px}

/* ===== Cabeçalho fixo ===== */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:var(--chrome);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-bottom:.5px solid var(--sep)}
.bar-in{height:var(--barh);display:flex;align-items:center;gap:12px;max-width:none}
.bar-logo{display:flex;align-items:center;height:36px;padding:0 4px;margin-left:-4px;border-radius:8px;flex:none}
.bar-logo img{height:17px;width:auto}
.bar-sep{width:.5px;height:22px;background:var(--sep);flex:none}
.bar-title{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.bar-title .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.bar-title .ic svg{width:15px;height:15px}
.bar-actions{display:flex;align-items:center;gap:6px;flex:none}
.pill{height:34px;padding:0 13px 0 10px;border-radius:17px;background:var(--fill);display:flex;align-items:center;gap:7px;
  font-size:15px;font-weight:500;color:var(--blue);transition:background .15s}
.pill:hover{background:var(--fill2)}
.pill svg{width:18px;height:18px}
.round{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--blue);transition:background .15s}
.round:hover{background:var(--fill2)}
.round svg{width:19px;height:19px}
.pill[aria-expanded="true"]{background:var(--fill2)}

@media (max-width:640px){
  .bar-logo img{height:14px}
  .pill{width:34px;padding:0;justify-content:center}
  .pill .lbl{display:none}
  .bar-title{font-size:16px}
  .bar-title .ic{display:none}
}
@media (max-width:360px){ .bar-sep{display:none} .bar-in{gap:8px} }

/* ===== Menu ===== */
.scrim{position:fixed;inset:0;z-index:60;background:transparent}
.menu{position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + var(--barh) + 6px);right:max(12px,env(safe-area-inset-right,0px));
  width:340px;max-height:calc(100dvh - var(--barh) - env(safe-area-inset-top,0px) - 24px);overflow:auto;
  background:var(--bg2);border-radius:16px;box-shadow:var(--pop);padding:6px;
  transform-origin:top right;animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.menu-grab{display:none}
.menu-head{padding:10px 12px 6px;font-size:13px;color:var(--label2)}
.mi{width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;text-align:left}
.mi:hover,.mi:focus-visible{background:var(--fill)}
.mi .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.mi .ic svg{width:19px;height:19px}
.mi .tx{flex:1;min-width:0}
.mi b{display:block;font-weight:600;font-size:15px}
.mi small{display:block;font-size:12.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .ck{width:18px;height:18px;color:var(--blue);opacity:0;flex:none}
.mi[aria-current="page"] .ck{opacity:1}
.menu hr{border:0;height:.5px;background:var(--sep);margin:5px 12px}
@media (max-width:640px){
  .scrim{background:rgba(0,0,0,.32);animation:fade .2s}
  .menu{top:auto;left:0;right:0;bottom:0;width:auto;max-height:82dvh;border-radius:14px 14px 0 0;
    padding:6px 10px calc(14px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
  .menu-grab{display:block;width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:4px auto 6px}
  .mi{padding:11px 10px}
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ===== Início ===== */
.home{padding:calc(var(--barh) + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));
  max-width:1120px;margin:0 auto}
.hero{position:relative;padding:72px 0 56px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero::before{content:"";position:absolute;left:50%;top:40%;width:min(640px,120%);aspect-ratio:2.4;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none;z-index:-1}
.hero-logo{width:min(340px,72vw);height:auto;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.hero p{margin-top:22px;font-size:19px;line-height:1.45;color:var(--label2);max-width:34ch;letter-spacing:-.015em;animation:rise .7s .08s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.gtitle{font-size:22px;font-weight:700;letter-spacing:-.025em;margin:0 4px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px 18px 16px;background:var(--bg2);border-radius:18px;
  box-shadow:var(--shadow);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.card:active{transform:scale(.98)}
.card .top{display:flex;align-items:center;justify-content:space-between}
.card .ic{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.15)}
.card .ic svg{width:28px;height:28px}
.card .go{display:flex;align-items:center;gap:2px;font-size:15px;color:var(--blue);font-weight:500}
.card .go svg{width:16px;height:16px}
.card h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
.card p{font-size:14.5px;color:var(--label2);margin-top:3px;line-height:1.4}
.note{margin:28px 4px 0;font-size:13px;color:var(--label2);text-align:center}

@media (max-width:640px){
  .hero{padding:44px 0 34px}
  .hero p{font-size:17px}
  .gtitle{font-size:20px}
  .grid{gap:0;background:var(--bg2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .card{flex-direction:row;align-items:center;gap:14px;padding:12px 14px;border-radius:0;box-shadow:none}
  .card:active{transform:none;background:var(--fill)}
  .card + .card::before{content:"";position:absolute;top:0;right:0;left:74px;height:.5px;background:var(--sep)}
  .card .top{display:contents}
  .card .ic{width:44px;height:44px;border-radius:11px}
  .card .ic svg{width:24px;height:24px}
  .card .tx{flex:1;min-width:0}
  .card h2{font-size:16px}
  .card p{font-size:13.5px;margin-top:1px}
  .card .go{order:3}
  .card .go span{display:none}
  .card .go svg{color:var(--label3);width:18px;height:18px}
}

/* ===== Palco das ferramentas ===== */
.stage{position:fixed;left:0;right:0;bottom:0;top:calc(var(--barh) + env(safe-area-inset-top,0px));background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.stage iframe{position:absolute;inset:0;width:100%;height:calc(100% - env(safe-area-inset-bottom,0px));border:0;background:var(--bg);display:block}
.stage iframe.off{visibility:hidden;pointer-events:none}
.loader{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.loader i{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--fill2);border-top-color:var(--label2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,16px);opacity:0;
  background:var(--toast);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--pop);
  padding:10px 18px;border-radius:22px;font-size:14px;font-weight:500;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>

" aria-label=\"Copiar moeda\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2.5\"/>\u003cpath d=\"M5 15V6a2 2 0 0 1 2-2h8\"/>\u003c/svg>\u003c/button>\u003c/div>\n            \u003cdiv class=\"res\">\u003cdiv class=\"res-body\">\u003cdiv class=\"res-l\">Algarismos romanos\u003c/div>\u003cdiv class=\"res-v\" id=\"rRom\">—\u003c/div>\u003c/div>\u003cbutton class=\"icon-btn\" data-act=\"copy\" data-target=\"#rRom\" aria-label=\"Copiar romano\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2.5\"/>\u003cpath d=\"M5 15V6a2 2 0 0 1 2-2h8\"/>\u003c/svg>\u003c/button>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n    \u003c/div>\n  \u003c/main>\n\n  \u003cnav class=\"tabbar\" id=\"tabbar\" aria-label=\"Ferramentas\">\u003c/nav>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003ci>✓\u003c/i>\u003cspan>Copiado\u003c/span>\u003c/div>\n\n\u003cscript>\n/* ==================== LÓGICA PURA (texto e números) ==================== */\nconst L = s => s.toLocaleLowerCase('pt-BR');\nconst U = s => s.toLocaleUpperCase('pt-BR');\nconst cap = s => s ? U(s.charAt(0)) + s.slice(1) : s;\nconst stripAcc = s => s.normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');\nconst graphemer = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('pt-BR', { granularity: 'grapheme' }) : null;\nconst graphemes = s => graphemer ? Array.from(graphemer.segment(s), x => x.segment) : Array.from(s);\nconst rev = s => graphemes(s).reverse().join('');\n\n/* ---- Número por extenso ---- */\nconst UN = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];\nconst DZ = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];\nconst CT = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];\nconst SC = [null, null, ['milhão','milhões'], ['bilhão','bilhões'], ['trilhão','trilhões'], ['quatrilhão','quatrilhões'], ['quintilhão','quintilhões'], ['sextilhão','sextilhões'], ['septilhão','septilhões']];\nfunction chunkWords(n, fem){\n  if (n === 100) return 'cem';\n  const g = w => fem ? (w === 'um' ? 'uma' : w === 'dois' ? 'duas' : w) : w;\n  const c = Math.floor(n / 100), r = n % 100, parts = [];\n  if (c) parts.push(fem && c > 1 ? CT[c].replace(/os$/, 'as') : CT[c]);\n  if (r) {\n    if (r \u003c 20) parts.push(g(UN[r]));\n    else { const d = Math.floor(r / 10), u = r % 10; parts.push(u ? DZ[d] + ' e ' + g(UN[u]) : DZ[d]); }\n  }\n  return parts.join(' e ');\n}\nfunction cardinal(n, fem = false){ // n: BigInt >= 0\n  if (n === 0n) return 'zero';\n  const groups = []; let x = n;\n  while (x > 0n) { groups.push(Number(x % 1000n)); x /= 1000n; }\n  if (groups.length > SC.length) throw new Error('grande');\n  const parts = [];\n  for (let i = groups.length - 1; i >= 0; i--) {\n    const v = groups[i]; if (!v) continue;\n    let s;\n    if (i === 0) s = chunkWords(v, fem);\n    else if (i === 1) s = v === 1 ? 'mil' : chunkWords(v, fem) + ' mil';\n    else s = chunkWords(v, false) + ' ' + (v === 1 ? SC[i][0] : SC[i][1]);\n    parts.push({ v, i, s });\n  }\n  let out = parts[0].s;\n  for (let k = 1; k \u003c parts.length; k++) {\n    const p = parts[k], prev = parts[k - 1], last = k === parts.length - 1;\n    if (last && (p.v \u003c 100 || p.v % 100 === 0)) out += ' e ';\n    else out += prev.i === 1 ? ' ' : ', ';\n    out += p.s;\n  }\n  return out;\n}\nfunction readDigits(frac){ // \"05\" -> \"zero cinco\"\n  const lead = frac.match(/^0*/)[0].length, rest = frac.slice(lead);\n  const w = Array(lead).fill('zero');\n  if (rest) w.push(cardinal(BigInt(rest)));\n  return w.join(' ');\n}\nconst FR = [null,['décimo','décimos'],['centésimo','centésimos'],['milésimo','milésimos'],['décimo de milésimo','décimos de milésimo'],['centésimo de milésimo','centésimos de milésimo'],['milionésimo','milionésimos']];\nfunction cardinalDecimal(p, fem){\n  const hasFrac = p.frac && /[1-9]/.test(p.frac);\n  if (!hasFrac) return cardinal(p.int, fem);\n  const len = p.frac.length;\n  if (len > 6) return cardinal(p.int, fem) + ' vírgula ' + readDigits(p.frac);\n  const f = BigInt(p.frac), fw = cardinal(f) + ' ' + (f === 1n ? FR[len][0] : FR[len][1]);\n  if (p.int === 0n) return fw;\n  return cardinal(p.int) + (p.int === 1n ? ' inteiro' : ' inteiros') + ' e ' + fw;\n}\nfunction moneyParts(p){\n  let int = p.int, cents = 0;\n  if (p.frac) {\n    const f = (p.frac + '000').slice(0, 3);\n    cents = Math.round(Number(f) / 10);\n    if (cents === 100) { cents = 0; int += 1n; }\n  }\n  return { int, cents };\n}\nfunction moneyWords(p){\n  const { int, cents } = moneyParts(p);\n  let s = '';\n  if (int > 0n) {\n    s = cardinal(int);\n    if (int >= 1000000n && int % 1000000n === 0n) s += ' de reais';\n    else s += int === 1n ? ' real' : ' reais';\n  }\n  if (cents > 0) {\n    const c = cardinal(BigInt(cents)) + (cents === 1 ? ' centavo' : ' centavos');\n    s = s ? s + ' e ' + c : c + ' de real';\n  }\n  return s || 'zero real';\n}\nconst OU = ['','primeiro','segundo','terceiro','quarto','quinto','sexto','sétimo','oitavo','nono'];\nconst OD = ['','décimo','vigésimo','trigésimo','quadragésimo','quinquagésimo','sexagésimo','septuagésimo','octogésimo','nonagésimo'];\nconst OC = ['','centésimo','ducentésimo','trecentésimo','quadringentésimo','quingentésimo','sexcentésimo','septingentésimo','octingentésimo','nongentésimo'];\nfunction ordChunk(n){\n  const w = [];\n  if (Math.floor(n / 100)) w.push(OC[Math.floor(n / 100)]);\n  if (Math.floor(n % 100 / 10)) w.push(OD[Math.floor(n % 100   var t = o;\n        if (mode === 'light' || mode === 'dark'){\n          t = o.replace(/\\(\\s*prefers-color-scheme\\s*:\\s*(dark|light)\\s*\\)/g, function(m, v){\n            return v === mode ? '(min-width: 0px)' : '(max-width: -1px)';\n          });\n        }\n        if (r.media.mediaText !== t) r.media.mediaText = t;\n      });\n    }\n  }\n  window.__honraTheme = apply;\n  try { apply(window.parent.__honraMode || 'auto'); } catch(e){}\n  window.addEventListener('load', function(){ try { apply(window.parent.__honraMode || 'auto'); } catch(e){} });\n  document.addEventListener('keydown', function(e){\n    if (e.key === 'Escape') { try { window.parent.postMessage({ honra: 'esc' }, '*'); } catch(_){} }\n  });\n})();\n\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\" id=\"app\">\n  \u003cheader class=\"nav\">\n    \u003cdiv>\n      \u003ch1>Link WhatsApp\u003c/h1>\n      \u003cp>Número, mensagem e rastreamento em um link wa.me\u003c/p>\n    \u003c/div>\n    \u003cbutton class=\"nav-btn\" id=\"resetBtn\" type=\"button\">Limpar\u003c/button>\n  \u003c/header>\n\n  \u003cmain class=\"main\">\n    \u003c!-- Formulário -->\n    \u003csection class=\"pane left\" aria-label=\"Configurar link\">\n      \u003cdiv class=\"group-title\">Número de destino\u003c/div>\n      \u003cdiv class=\"group\">\n        \u003cdiv class=\"row phone-row\">\n          \u003cselect class=\"cc\" id=\"cc\" aria-label=\"Código do país\">\n            \u003coption value=\"55\" data-flag=\"🇧🇷\" selected>🇧🇷 +55\u003c/option>\n            \u003coption value=\"351\" data-flag=\"🇵🇹\">🇵🇹 +351\u003c/option>\n            \u003coption value=\"1\" data-flag=\"🇺🇸\">🇺🇸 +1\u003c/option>\n            \u003coption value=\"54\" data-flag=\"🇦🇷\">🇦🇷 +54\u003c/option>\n            \u003coption value=\"598\" data-flag=\"🇺🇾\">🇺🇾 +598\u003c/option>\n            \u003coption value=\"595\" data-flag=\"🇵🇾\">🇵🇾 +595\u003c/option>\n            \u003coption value=\"56\" data-flag=\"🇨🇱\">🇨🇱 +56\u003c/option>\n            \u003coption value=\"57\" data-flag=\"🇨🇴\">🇨🇴 +57\u003c/option>\n            \u003coption value=\"52\" data-flag=\"🇲🇽\">🇲🇽 +52\u003c/option>\n            \u003coption value=\"34\" data-flag=\"🇪🇸\">🇪🇸 +34\u003c/option>\n            \u003coption value=\"39\" data-flag=\"🇮🇹\">🇮🇹 +39\u003c/option>\n            \u003coption value=\"33\" data-flag=\"🇫🇷\">🇫🇷 +33\u003c/option>\n            \u003coption value=\"49\" data-flag=\"🇩🇪\">🇩🇪 +49\u003c/option>\n            \u003coption value=\"44\" data-flag=\"🇬🇧\">🇬🇧 +44\u003c/option>\n            \u003coption value=\"81\" data-flag=\"🇯🇵\">🇯🇵 +81\u003c/option>\n          \u003c/select>\n          \u003cinput type=\"tel\" id=\"phone\" inputmode=\"tel\" autocomplete=\"tel-national\" placeholder=\"(12) 99999-9999\" aria-label=\"Número com DDD\">\n          \u003cspan class=\"status-dot empty\" id=\"phoneStatus\" aria-hidden=\"true\">\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cp class=\"foot\" id=\"phoneHint\">Deixe vazio para a pessoa escolher o contato no próprio WhatsApp.\u003c/p>\n\n      \u003cdiv class=\"group-title\">Mensagem pré-preenchida\u003c/div>\n      \u003cdiv class=\"group\">\n        \u003ctextarea id=\"msg\" placeholder=\"Olá! Gostaria de mais informações.\" aria-label=\"Mensagem\">\u003c/textarea>\n        \u003cdiv class=\"toolbar\" role=\"toolbar\" aria-label=\"Formatação\">\n          \u003cbutton class=\"tool\" type=\"button\" data-wrap=\"*\" title=\"Negrito\">\u003cb>B\u003c/b>\u003c/button>\n          \u003cbutton class=\"tool\" type=\"button\" data-wrap=\"_\" title=\"Itálico\">\u003ci>I\u003c/i>\u003c/button>\n          \u003cbutton class=\"tool\" type=\"button\" data-wrap=\"~\" title=\"Tachado\">\u003cs>S\u003c/s>\u003c/button>\n          \u003cbutton class=\"tool mono\" type=\"button\" data-wrap=\"```\" title=\"Monoespaçado\">{ }\u003c/button>\n          \u003cspan class=\"count\" id=\"count\">0 caracteres\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cp class=\"foot\">Selecione um trecho e toque num botão para formatar do jeito que o WhatsApp exibe.\u003c/p>\n\n      \u003cdiv class=\"group-title\">Rastreamento\u003c/div>\n      \u003cdiv class=\"group\" id=\"trackGroup\">\n        \u003cdiv class=\"row\">\n          \u003cspan>Rastrear origem\u003c/span>\n          \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"trackOn\" aria-label=\"Ativar rastreamento\">\u003cspan>\u003c/span>\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"tracking-body\">\n          \u003cdiv class=\"seg-wrap\">\n            \u003cdiv class=\"seg\" id=\"seg\" data-v=\"0\" role=\"tablist\">\n              \u003cspan class=\"thumb\">\u003c/span>\n              \u003cbutton type=\"button\" role=\"tab\" data-v=\"0\" aria-selected=\"true\">Código na mensagem\u003c/button>\n              \u003cbutton type=\"button\" role=\"tab\" data-v=\"1\" aria-selected=\"false\">Link com UTM\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"chips\" id=\"chips\" aria-label=\"Origens rápidas\">\n            \u003cbutton class=\"chip\" type=\"button\" data-src=\"instagram\">Instagram\u003c/button>\n            \u003cbutton class=\"chip\" type=\"button\" data-src=\"facebook\">Facebook\u003c/button>\n            \u003cbutton class=\"chip\" type=\"button\" data-src=\"google\">Google\u003c/button>\n            \u003cbutton class=\"chip\" type=\"button\" data-src=\"site\">Site\u003c/button>\n            \u003cbutton class=\"chip\" type=\"button\" data-src=\"email\">E-mail\u003c/button>\n            \u003cbutton class=\"chip\" type=\"button\" data-src=\"qrcode\">QR Code\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"row\">\u003clabel class=\"l\" for=\"src\">Origem\u003c/label>\u003cinput type=\"text\" id=\"src\" placeholder=\"instagram\" autocapitalize=\"off\" autocomplete=\"off\">\u003c/div>\n          \u003cdiv class=\"row\">\u003clabel class=\"l\" for=\"med\">Mídia\u003c/label>\u003cinput type=\"text\" id=\"med\" placeholder=\"stories, bio, cpc\" autocapitalize=\"off\" autocomplete=\"off\">\u003c/div>\n          \u003cdiv class=\"row\">\u003clabel class=\"l\" for=\"camp\">Campanha\u003c/label>\u003cinput type=\"text\" id=\"camp\" placeholder=\"vestibular-2027\" autocapitalize=\"off\" autocomplete=\"off\">\u003c/div>\n          \u003cdiv class=\"row\">\u003clabel class=\"l\" for=\"cont\">Conteúdo\u003c/label>\u003cinput type=\"text\" id=\"cont\" placeholder=\"opcional\" autocapitalize=\"off\" autocomplete=\"off\">\u003c/div>\n          \u003cdiv class=\"redirect-only\">\n            \u003cdiv class=\"row\">\u003clabel class=\"l\" for=\"base\">Sua página\u003c/label>\u003cinput type=\"url\" id=\"base\" placeholder=\"https://seusite.com.br/whatsapp\" autocapitalize=\"off\" autocomplete=\"off\">\u003c/div>\n            \u003cdiv class=\"row\">\u003clabel class=\"l\" for=\"ga\">ID do GA4\u003c/label>\u003cinput type=\"text\" id=\"ga\" placeholder=\"G-XXXXXXXXXX\" autocapitalize=\"characters\" autocomplete=\"off\" spellcheck=\"false\">\u003c/div>\n            \u003cdiv class=\"row\">\n              \u003cbutton class=\"row-btn\" type=\"button\" id=\"copyPage\">\n                \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M8 7l-5 5 5 5\"/>\u003cpath d=\"M16 7l5 5-5 5\"/>\u003c/svg>\n                Copiar HTML da página\n              \u003c/button>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"tracking-body-foot\">\n        \u003cp class=\"foot inmsg-only\" id=\"trackFoot1\">O wa.me não repassa UTMs. Por isso um código curto vai no fim da mensagem e aparece na conversa, identificando de onde a pessoa veio.\u003c/p>\n        \u003cp class=\"foot redirect-only\" id=\"trackFoot2\">O link passa por uma página sua, que registra as UTMs no Analytics e redireciona na hora para o WhatsApp. O HTML copiado já vem com número, mensagem, UTMs e ID do GA4 preenchidos. \u003cbutton class=\"link-btn\" type=\"button\" id=\"openSheet\">Ver código\u003c/button>\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- Resultado -->\n    \u003csection class=\"pane right\" aria-label=\"Resultado\">\n      \u003cdiv class=\"group-title\">Prévia\u003c/div>\n      \u003cdiv class=\"chat\" aria-label=\"Prévia da conversa\">\n        \u003cdiv class=\"chat-head\">\n          \u003cdiv class=\"avatar\" id=\"avatar\">?\u003c/div>\n          \u003cdiv>\u003cstrong id=\"chatName\">Escolher contato\u003c/strong>\u003csmall>WhatsApp\u003c/small>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"chat-body\">\u003cdiv class=\"bubble empty\" id=\"bubble\">Sem mensagem — o chat abre em branco.\u003c/div>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"group-title\">Seu link\u003c/div>\n      \u003cdiv class=\"group\">\u003cdiv class=\"linkbox\" id=\"link\" aria-live=\"polite\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"out-grid\">\n        \u003cdiv class=\"actions\">\n          \u003cbutton class=\"btn primary\" type=\"button\" id=\"copyBtn\">\n            \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1\"/>\u003c/svg>Copiar link\u003c/button>\n          \u003cbutton class=\"btn tinted\" type=\"button\" id=\"openBtn\">\n            \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M14 4h6v6\"/>\u003cpath d=\"M20 4l-9 9\"/>\u003cpath d=\"M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5\"/>\u003c/svg>Testar\u003c/button>\n          \u003cbutton class=\"btn tinted utm-only\" type=\"button\" id=\"copyHtmlBtn\">\n            \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M8 7l-5 5 5 5\"/>\u003cpath d=\"M16 7l5 5-5 5\"/>\u003c/svg>Copiar HTML\u003c/button>\n          \u003cp class=\"foot utm-only\" style=\"margin:2px 4px 0\">O HTML é a página de redirecionamento com seus dados e o GA4 preenchidos.\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"group qr-card\">\n          \u003cdiv class=\"qr\" id=\"qr\">\u003c/div>\n          \u003cp id=\"qrNote\">Aponte a câmera do celular para abrir a conversa.\u003c/p>\n          \u003cdiv class=\"qr-btns\">\n            \u003cbutton class=\"btn tinted\" type=\"button\" id=\"dlQr\">Baixar PNG\u003c/button>\n            \u003cbutton class=\"btn tinted\" type=\"button\" id=\"dlSvg\">Baixar SVG\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\u003c/div>\n\n\u003c!-- Sheet com código da página de redirecionamento -->\n\u003cdiv class=\"backdrop\" id=\"backdrop\">\u003c/div>\n\u003cdiv class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\">\n  \u003cdiv class=\"grabber\">\u003c/div>\n  \u003cdiv class=\"sheet-head\">\n    \u003cbutton class=\"nav-btn\" type=\"button\" id=\"copySnippet\">Copiar\u003c/button>\n    \u003ch2 id=\"sheetTitle\">Página de redirecionamento\u003c/h2>\n    \u003cbutton class=\"nav-btn\" type=\"button\" id=\"closeSheet\" style=\"font-weight:600\">OK\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"sheet-body\">\n    \u003cdiv class=\"group-title\" style=\"margin-top:4px\">Como usar\u003c/div>\n    \u003cdiv class=\"group\" style=\"padding:14px 16px\">\n      \u003col class=\"steps\">\n        \u003cli>Preencha “Sua página” e “ID do GA4” no formulário.\u003c/li>\n        \u003cli>Copie o código abaixo, que já está com os seus dados.\u003c/li>\n        \u003cli>Publique como uma página do seu site (ex.: \u003ccode>/whatsapp\u003c/code>).\u003c/li>\n        \u003cli>Divulgue o link gerado. No GA4, a visita chega com as UTMs e o evento \u003ccode>whatsapp_click\u003c/code>.\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n    \u003cdiv class=\"group-title\">Código HTML\u003c/div>\n    \u003cdiv class=\"group\">\u003cpre id=\"snippet\">\u003c/pre>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003ci>✓\u003c/i>\u003cspan id=\"toastText\">Link copiado\u003c/span>\u003c/div>\n\n\u003cscript>\n(function(){\n  const $ = s => document.querySelector(s);\n  const els = {\n    app:$('#app'), cc:$('#cc'), phone:$('#phone'), status:$('#phoneStatus'), hint:$('#phoneHint'),\n    msg:$('#msg'), count:$('#count'), trackOn:$('#trackOn'), group:$('#trackGroup'), seg:$('#seg'),\n    src:$('#src'), med:$('#med'), camp:$('#camp'), cont:$('#cont'), base:$('#base'), ga:$('#ga'),\n    bubble:$('#bubble'), chatName:$('#chatName'), avatar:$('#avatar'), link:$('#link'),\n    copyBtn:$('#copyBtn'), openBtn:$('#openBtn'), dlSvg:$('#dlSvg'),\n    qr:$('#qr'), qrNote:$('#qrNote'), dlQr:$('#dlQr'), toast:$('#toast'), toastText:$('#toastText'),\n    snippet:$('#snippet')\n  };\n  let mode = 0; // 0 = código na mensagem, 1 = link com UTM\n  let currentUrl = '';\n  let qr = null;\n  const STORE = 'wa-link-gen-v1';\n\n  /* ---------- Utilidades ---------- */\n  const digits = s => (s||'').replace(/\\D/g,'');\n  const slug = s => (s||'').trim().toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')\n                    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');\n  const esc = s => s.replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\n  function maskBR(d){\n    d = d.slice(0,11);\n    if(d.length\u003c=2) return d.length? '('+d : '';\n    if(d.length\u003c=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;\n    if(d.length\u003c=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;\n    return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;\n  }\n\n  function waFormat(text){\n    let h = esc(text);\n    h = h.replace(/```([\\s\\S]+?)```/g,'\u003ccode>$1\u003c/code>');\n    h = h.replace(/(^|[\\s>(])\\*(?!\\s)([^*\\n]+?)\\*(?=$|[\\s\u003c.,!?)])/g,'$1\u003cb>$2\u003c/b>');\n    h = h.replace(/(^|[\\s>(])_(?!\\s)([^_\\n]+?)_(?=$|[\\s\u003c.,!?)])/g,'$1\u003ci>$2\u003c/i>');\n    h = h.replace(/(^|[\\s>(])~(?!\\s)([^~\\n]+?)~(?=$|[\\s\u003c.,!?)])/g,'$1\u003cs>$2\u003c/s>');\n    return h.replace(/\\n/g,'\u003cbr>');\n  }\n\n  function trackingCode(){\n    return [els.src.value, els.med.value, els.camp.value, els.cont.value]\n      .map(slug).filter(Boolean).join('-').toUpperCase();\n  }\n\n  function fullNumber(){\n    const d = digits(els.phone.value);\n    if(!d) return '';\n    let n = d.replace(/^0+/,'');\n    if(n.startsWith(els.cc.value) && n.length > 11) return n; // usuário já colou com DDI\n    return els.cc.value + n;\n  }\n\n  function validatePhone(){\n    const d = digits(els.phone.value);\n    const s = els.status;\n    if(!d){ s.className='status-dot empty'; s.textContent='';\n      els.hint.textContent='Deixe vazio para a pessoa escolher o contato no próprio WhatsApp.'; els.hint.classList.remove('warn'); return true; }\n    let ok;\n    if(els.cc.value==='55'){ const n=d.replace(/^0+/,'').replace(/^55(?=\\d{10,11}$)/,''); ok = n.length===10||n.length===11; }\n    else ok = d.length>=6 && d.length\u003c=14;\n    s.className = 'status-dot ' + (ok?'ok':'bad'); s.textContent = ok?'✓':'!';\n    if(ok){ els.hint.textContent='Número completo: +' + fullNumber(); els.hint.classList.remove('warn'); }\n    else { els.hint.textContent = els.cc.value==='55' ? 'Informe DDD + número (10 ou 11 dígitos).' : 'Confira o número informado.'; els.hint.classList.add('warn'); }\n    return ok;\n  }\n\n  /* ---------- Montagem do link ---------- */\n  function finalMessage(){\n    let m = els.msg.value;\n    if(els.trackOn.checked && mode===0){\n      const code = trackingCode();\n      if(code) m = (m.trim() ? m.replace(/\\s+$/,'') + '\\n\\n' : '') + 'Ref: ' + code;\n    }\n    return m;\n  }\n\n  function waUrl(){\n    const n = fullNumber();\n    const m = finalMessage();\n    let u = 'https://wa.me/' + n;\n    if(m) u += '?text=' + encodeURIComponent(m);\n    return u;\n  }\n\n  function buildUrl(){\n    if(els.trackOn.checked && mode===1){\n      const base = els.base.value.trim() || 'https://seusite.com.br/whatsapp';\n      const p = new URLSearchParams();\n      const map = {utm_source:els.src, utm_medium:els.med, utm_campaign:els.camp, utm_content:els.cont};\n      for(const k in map){ const v = slug(map[k].value); if(v) p.set(k,v); }\n      const n = fullNumber(); if(n) p.set('phone', n);\n      const m = finalMessage(); if(m) p.set('text', m);\n      const qs = p.toString().replace(/\\+/g,'%20');\n      return base + (base.includes('?') ? '&' : '?') + qs;\n    }\n    return waUrl();\n  }\n\n  function update(){\n    const d = digits(els.phone.value);\n    validatePhone();\n    const m = finalMessage();\n    const len = [...els.msg.value].length;\n    els.count.textContent = len + (len===1?' caractere':' caracteres');\n\n    // prévia\n    if(m){ els.bubble.classList.remove('empty');\n      const t = new Date(); const hh = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');\n      els.bubble.innerHTML = waFormat(m) + `\u003cspan class=\"meta\">${hh} ✓✓\u003c/span>`; }\n    else { els.bubble.classList.add('empty'); els.bubble.textContent='Sem mensagem — o chat abre em branco.'; }\n    if(d){ els.chatName.textContent = '+' + els.cc.value + ' ' + (els.cc.value==='55'?maskBR(d.replace(/^0+/,'')):d); els.avatar.textContent = els.cc.selectedOptions[0].dataset.flag; }\n    else { els.chatName.textContent='Escolher contato'; els.avatar.textContent='?'; }\n\n    currentUrl = buildUrl();\n    els.link.textContent = currentUrl;\n    const needBase = els.trackOn.checked && mode===1 && !els.base.value.trim();\n    els.openBtn.disabled = needBase;\n    renderQR();\n    els.snippet.textContent = buildSnippet();\n    save();\n  }\n\n  /* ---------- QR ---------- */\n  let qrTimer;\n  function renderQR(){\n    clearTimeout(qrTimer);\n    qrTimer = setTimeout(()=>{\n      if(typeof QRCode==='undefined'){ els.qrNote.textContent='QR indisponível sem internet.'; els.dlQr.disabled=true; els.dlSvg.disabled=true; return; }\n      els.qr.innerHTML='';\n      try{\n        qr = new QRCode(els.qr,{text:currentUrl,width:512,height:512,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});\n        els.qrNote.textContent='Aponte a câmera do celular para abrir a conversa.'; els.qrNote.classList.remove('warn'); els.dlQr.disabled=false; els.dlSvg.disabled=false;\n      }catch(e){\n        els.qr.innerHTML=''; els.qrNote.textContent='Mensagem longa demais para QR Code. Encurte o texto.'; els.qrNote.classList.add('warn'); els.dlQr.disabled=true; els.dlSvg.disabled=true; qr=null;\n      }\n    },120);\n  }\n\n  /* ---------- Persistência ---------- */\n  function save(){\n    try{ localStorage.setItem(STORE, JSON.stringify({cc:els.cc.value,phone:els.phone.value,msg:els.msg.value,track:els.trackOn.checked,mode,\n      src:els.src.value,med:els.med.value,camp:els.camp.value,cont:els.cont.value,base:els.base.value,ga:els.ga.value})); }catch(e){}\n  }\n  function load(){\n    try{\n      const s = JSON.parse(localStorage.getItem(STORE)||'null'); if(!s) return;\n      els.cc.value=s.cc||'55'; els.phone.value=s.phone||''; els.msg.value=s.msg||''; els.trackOn.checked=!!s.track;\n      ['src','med','camp','cont','base','ga'].forEach(k=>els[k].value=s[k]||''); setMode(s.mode||0,true);\n    }catch(e){}\n  }\n\n  /* ---------- UI ---------- */\n  function setMode(v,silent){\n    mode = +v; els.seg.dataset.v = mode;\n    els.seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.dataset.v==mode));\n    els.app.classList.toggle('mode-redirect', mode===1);\n    if(!silent) update();\n  }\n  function syncTrack(){ els.app.classList.toggle('tracking-on', els.trackOn.checked);\n    document.querySelector('.tracking-body-foot').style.display = els.trackOn.checked ? '' : 'none'; syncChips(); }\n  function syncChips(){ const v = slug(els.src.value); document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.src===v)); }\n\n  let toastTimer;\n  function toast(t){ els.toastText.textContent=t; els.toast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1800); }\n\n  async function copy(text,msg){\n    try{ await navigator.clipboard.writeText(text); }\n    catch(e){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }\n    toast(msg||'Link copiado');\n  }\n\n  function wrap(mark){\n    const t = els.msg, s=t.selectionStart, e=t.selectionEnd, v=t.value;\n    const sel = v.slice(s,e) || 'texto';\n    t.value = v.slice(0,s) + mark + sel + mark + v.slice(e);\n    t.focus(); t.setSelectionRange(s+mark.length, s+mark.length+sel.length);\n    update();\n  }\n\n  els.phone.addEventListener('input',()=>{\n    if(els.cc.value==='55'){ const d=digits(els.phone.value); if(d.length\u003c=11 && !d.startsWith('0')) {\n      const pos = els.phone.value.length; els.phone.value = maskBR(d); } }\n    update();\n  });\n  els.phone.addEventListener('paste',e=>{\n    const t=(e.clipboardData||window.clipboardData).getData('text'); let d=digits(t);\n    if(!d) return; e.preventDefault();\n    if(t.trim().startsWith('+')){ const opt=[...els.cc.options].sort((a,b)=>b.value.length-a.value.length).find(o=>d.startsWith(o.value)); if(opt){ els.cc.value=opt.value; d=d.slice(opt.value.length);} }\n    else if(els.cc.value==='55' && d.length>=12 && d.startsWith('55')) d=d.slice(2);\n    els.phone.value = els.cc.value==='55' ? maskBR(d.replace(/^0+/,'')) : d; update();\n  });\n  els.cc.addEventListener('change',()=>{ els.phone.placeholder = els.cc.value==='55' ? '(12) 99999-9999' : 'Número'; \n    els.phone.value = els.cc.value==='55' ? maskBR(digits(els.phone.value)) : digits(els.phone.value); update(); });\n  els.msg.addEventListener('input',update);\n  document.querySelectorAll('[data-wrap]').forEach(b=>b.addEventListener('click',()=>wrap(b.dataset.wrap)));\n  els.trackOn.addEventListener('change',()=>{ syncTrack(); update(); });\n  els.seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.v)));\n  ['src','med','camp','cont','base','ga'].forEach(k=>els[k].addEventListener('input',()=>{ if(k==='src') syncChips(); update(); }));\n  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{\n    els.src.value = c.classList.contains('on') ? '' : c.dataset.src; syncChips(); update();\n  }));\n\n  els.copyBtn.addEventListener('click',()=>copy(currentUrl,'Link copiado'));\n  els.openBtn.addEventListener('click',()=>window.open(currentUrl,'_blank','noopener'));\n  els.dlQr.addEventListener('click',()=>{\n    const c = els.qr.querySelector('canvas'), img = els.qr.querySelector('img');\n    let src = c ? c.toDataURL('image/png') : (img && img.src);\n    if(!src) return;\n    // adiciona margem branca\n    const pad=48, cv=document.createElement('canvas'), im=new Image();\n    im.onload=()=>{ cv.width=im.width+pad*2; cv.height=im.height+pad*2; const x=cv.getContext('2d');\n      x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(im,pad,pad);\n      const a=document.createElement('a'); a.href=cv.toDataURL('image/png');\n      a.download=qrName()+'.png'; document.body.appendChild(a); a.click(); a.remove(); toast('QR Code baixado'); };\n    im.src=src;\n  });\n  function qrName(){ return 'qrcode-whatsapp' + (slug(els.camp.value)?'-'+slug(els.camp.value):''); }\n  function qrSvg(){\n    const m = qr && qr._oQRCode; if(!m) return null;\n    const n = m.getModuleCount(), q = 4, size = n + q*2; let d = '';\n    for(let r=0;r\u003cn;r++){ for(let c=0;c\u003cn;c++){ if(m.isDark(r,c)) d += 'M'+(c+q)+' '+(r+q)+'h1v1h-1z'; } }\n    return '\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 '+size+' '+size+'\" width=\"1024\" height=\"1024\" shape-rendering=\"crispEdges\">'\n      + '\u003crect width=\"'+size+'\" height=\"'+size+'\" fill=\"#ffffff\"/>\u003cpath d=\"'+d+'\" fill=\"#000000\"/>\u003c/svg>';\n  }\n  els.dlSvg.addEventListener('click',()=>{\n    const svg = qrSvg(); if(!svg) return;\n    const url = URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));\n    const a=document.createElement('a'); a.href=url; a.download=qrName()+'.svg'; document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(()=>URL.revokeObjectURL(url),1000); toast('SVG baixado');\n  });\n\n  $('#resetBtn').addEventListener('click',()=>{\n    els.phone.value=''; els.msg.value=''; ['src','med','camp','cont'].forEach(k=>els[k].value='');\n    els.trackOn.checked=false; setMode(0,true); syncTrack(); update(); els.phone.focus();\n  });\n\n  /* ---------- Sheet do redirecionamento ---------- */\n  function buildSnippet(){\n    const ga = els.ga.value.trim().toUpperCase() || 'G-XXXXXXXXXX';\n    const cfg = {\n      phone: fullNumber(),\n      text: finalMessage(),\n      utm_source: slug(els.src.value), utm_medium: slug(els.med.value),\n      utm_campaign: slug(els.camp.value), utm_content: slug(els.cont.value)\n    };\n    const json = JSON.stringify(cfg,null,2).replace(/\u003c/g,'\\\\u003c').replace(/\\n/g,'\\n  ');\n    const fallback = 'https://wa.me/' + cfg.phone + (cfg.text ? '?text=' + encodeURIComponent(cfg.text) : '');\n    const attr = s => s.replace(/&/g,'&amp;').replace(/\"/g,'&quot;');\n    return `\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"robots\" content=\"noindex\">\n\u003ctitle>Abrindo o WhatsApp…\u003c/title>\n\u003c\\!-- Google Analytics 4 -->\n\u003c\\script async src=\"https://www.googletagmanager.com/gtag/js?id=${ga}\">\u003c\\/script>\n\u003c\\script>\n  window.dataLayer = window.dataLayer || [];\n  function gtag(){dataLayer.push(arguments);}\n  gtag('js', new Date());\n  gtag('config', '${ga}');\n\u003c\\/script>\n\u003c/head>\n\u003cbody style=\"font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:48px 20px;color:#3c3c43\">\n\u003cp>Abrindo o WhatsApp…\u003c/p>\n\u003cp>\u003ca id=\"go\" href=\"${attr(fallback)}\" style=\"color:#007AFF\">Toque aqui se não abrir\u003c/a>\u003c/p>\n\u003c\\script>\n  // Dados preenchidos pelo gerador. Parâmetros na URL têm prioridade.\n  var DADOS = ${json};\n  var q = new URLSearchParams(location.search);\n  function v(k){ return q.get(k) || DADOS[k] || ''; }\n  var phone = v('phone').replace(/\\\\D/g, '');\n  var text = v('text');\n  var dest = 'https://wa.me/' + phone + (text ? '?text=' + encodeURIComponent(text) : '');\n  document.getElementById('go').href = dest;\n  var done = false;\n  function go(){ if(!done){ done = true; location.replace(dest); } }\n  gtag('event', 'whatsapp_click', {\n    utm_source: v('utm_source'), utm_medium: v('utm_medium'),\n    utm_campaign: v('utm_campaign'), utm_content: v('utm_content'),\n    event_callback: go\n  });\n  setTimeout(go, 800); // garante o redirecionamento\n\u003c\\/script>\n\u003c/body>\n\u003c/html>`;\n  }\n  $('#copyHtmlBtn').addEventListener('click',()=>$('#copyPage').click());\n  $('#copyPage').addEventListener('click',()=>{\n    copy(buildSnippet(), els.ga.value.trim() ? 'HTML copiado' : 'HTML copiado (falta o ID do GA4)');\n  });\n  const openSheet=()=>{ document.body.classList.add('sheet-open'); };\n  const closeSheet=()=>{ document.body.classList.remove('sheet-open'); };\n  $('#openSheet').addEventListener('click',openSheet);\n  $('#closeSheet').addEventListener('click',closeSheet);\n  $('#backdrop').addEventListener('click',closeSheet);\n  $('#copySnippet').addEventListener('click',()=>copy(buildSnippet(),'HTML copiado'));\n  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });\n\n  /* ---------- Início ---------- */\n  load(); syncTrack(); update();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "qrcode": "\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#f2f2f7\" media=\"(prefers-color-scheme: light)\">\n\u003cmeta name=\"theme-color\" content=\"#000000\" media=\"(prefers-color-scheme: dark)\">\n\u003ctitle>QRCode Pro\u003c/title>\n\u003clink rel=\"icon\" href=\"data:image/svg+xml,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\u003ctext y='.9em' font-size='90'>🔳\u003c/text>\u003c/svg>\">\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js\">\u003c/script>\n\u003cstyle>\n:root{\n  --bg:#f2f2f7; --card:#fff; --card2:#f2f2f7; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);\n  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.16);\n  --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500; --plate:#e9e9ee;\n  --font:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Helvetica Neue\",\"Segoe UI\",Roboto,Inter,system-ui,sans-serif;\n  --mono:ui-monospace,\"SF Mono\",SFMono-Regular,Menlo,Consolas,monospace;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme:dark){\n  :root{\n    --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);\n    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);\n    --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --plate:#2c2c2e;\n  }\n}\n*,*::before,*::after{box-sizing:inherit}\nhtml,body{height:100%;margin:0}\nbody{font-family:var(--font);background:var(--bg);color:var(--label);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.3;overflow:hidden;-webkit-tap-highlight-color:transparent}\nbutton,input,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer;border:0;background:none;padding:0}\n:focus-visible{outline:2px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px;border-radius:8px}\n[hidden]{display:none!important}\n\n/* ---------- Estrutura ---------- */\n.app{height:100%;display:flex;flex-direction:column}\n.top{flex:0 0 48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:.5px solid var(--sep);background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}\n.logo{width:26px;height:26px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center}\n.logo svg{width:16px;height:16px}\n.top h1{font-size:17px;font-weight:700;letter-spacing:-.2px;margin:0}\n.badge{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:4px 10px;border-radius:99px;background:var(--fill);font-size:12px;color:var(--label2);font-weight:500}\n.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}\n.top .reset{margin-left:auto;color:var(--blue);font-size:13px;font-weight:500;padding:6px 8px;border-radius:8px}\n.top .reset:hover{background:var(--fill)}\n\n.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:12px}\n.cols{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}\n.col{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}\n.pcol{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}\n\n/* ---------- Cartões ---------- */\n.card{background:var(--card);border-radius:14px;padding:10px 12px 12px}\n.head{display:flex;align-items:center;gap:8px;margin:0 0 8px}\n.step{width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}\n.head h2{font-size:13px;font-weight:600;margin:0}\n.head .sub{margin-left:auto;font-size:11px;color:var(--label2)}\n.hint{font-size:11px;color:var(--label2);margin:6px 0 0;line-height:1.35}\n.sublbl{font-size:11px;color:var(--label2);margin:8px 0 5px;display:flex;justify-content:space-between}\n.sublbl:first-child{margin-top:0}\n\n.rows > .row{border-top:.5px solid var(--sep)}\n.rows > .row:first-child,.rows > [hidden] + .row:not([hidden]):nth-child(2){border-top:0}\n.row{display:flex;align-items:center;gap:10px;min-height:32px;padding:3px 0}\n.row > .lbl{flex:0 0 auto;min-width:92px;font-size:13px}\n.row .val{margin-left:auto;color:var(--label2);font-size:12px;font-variant-numeric:tabular-nums}\n.row input[type=text],.row input[type=url],.row input[type=tel],.row input[type=email],.row input[type=password]{\n  flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px;padding:4px 0}\n.row input::placeholder,textarea::placeholder{color:var(--label3)}\ntextarea{width:100%;border:0;background:transparent;outline:none;resize:none;font-size:13px;min-height:52px;padding:6px 0;line-height:1.35;display:block}\n.row.ta{display:block;padding:0}\n\n/* ---------- Tipos ---------- */\n.types{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}\n.type{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:10px;background:var(--card2);font-size:10.5px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}\n.type .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--blue)}\n.type .ic svg{width:16px;height:16px}\n.type[aria-pressed=true]{background:var(--blue);color:#fff}\n.type[aria-pressed=true] .ic{color:#fff}\n.type:active,.chip:active{transform:scale(.95)}\n\n/* ---------- Segmentado ---------- */\n.seg{display:flex;background:var(--fill);border-radius:8px;padding:2px;gap:2px;width:100%}\n.seg button{flex:1;padding:4px 6px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}\n.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}\n@media (prefers-color-scheme:dark){.seg button[aria-pressed=true]{background:#636366}}\n\n/* ---------- Switch ---------- */\n.switch{appearance:none;-webkit-appearance:none;width:38px;height:23px;border-radius:23px;background:var(--fill2);position:relative;cursor:pointer;flex:0 0 auto;margin:0 0 0 auto;transition:background .2s}\n.switch::after{content:\"\";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .22s cubic-bezier(.3,.7,.4,1)}\n.switch:checked{background:var(--green)}\n.switch:checked::after{transform:translateX(15px)}\n\n/* ---------- Slider ---------- */\ninput[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}\ninput[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(var(--blue),var(--blue)) 0/var(--p,50%) 100% no-repeat,var(--fill2)}\ninput[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--fill2)}\ninput[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--blue)}\ninput[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 .5px 3px rgba(0,0,0,.15),0 3px 8px rgba(0,0,0,.15)}\ninput[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff;box-shadow:0 .5px 3px rgba(0,0,0,.15),0 3px 8px rgba(0,0,0,.15)}\n\n/* ---------- Cores ---------- */\n.swatch{position:relative;width:22px;height:22px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2),0 0 0 2px var(--card),0 0 0 3px var(--fill2);overflow:hidden}\n.swatch input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;cursor:pointer}\n.hex{font-family:var(--mono);font-size:11px;color:var(--label2);margin-left:auto;text-transform:uppercase}\n.presets{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;padding:3px 2px 8px}\n.preset{width:100%;max-width:26px;aspect-ratio:1;justify-self:center;border-radius:50%;position:relative;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}\n.preset::after{content:\"\";position:absolute;inset:28%;border-radius:50%;background:var(--b)}\n.preset[aria-pressed=true]{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--blue)}\n\n/* ---------- Chips ---------- */\n.chips{display:grid;gap:6px}\n.chip{display:flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:5px;border-radius:9px;background:var(--card2);font-size:11.5px;color:var(--label);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s,color .15s;white-space:nowrap}\n.chip svg{width:18px;height:18px;flex:0 0 auto}\n.chip img{width:18px;height:18px;border-radius:4px;object-fit:cover}\n.chip[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--card))}\n.c3{grid-template-columns:repeat(3,1fr)}\n.c8{grid-template-columns:repeat(8,1fr)}\n.c5{grid-template-columns:repeat(5,1fr)}\n.c5 .chip{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 2px}\n.c8 .chip{padding:0;aspect-ratio:1;min-height:0}\n.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}\n.frames{grid-template-columns:repeat(6,1fr)}\n.frames .chip{padding:4px;aspect-ratio:1;min-height:0}\n.frames .chip svg{width:100%;height:100%}\n\n/* ---------- Prévia ---------- */\n.pcard{display:flex;flex-direction:column;align-items:center;gap:10px}\n.plate{position:relative;width:100%;max-width:min(100%,36vh);aspect-ratio:1;border-radius:14px;background:var(--plate);display:grid;place-items:center;padding:14px}\n.plate.checker{background:repeating-conic-gradient(#dcdce1 0 25%,#f4f4f7 0 50%) 0 0/16px 16px}\n#qr{position:absolute;inset:12px;transition:opacity .2s}\n#qr canvas{width:100%;height:100%;object-fit:contain;display:block}\n.plate.empty #qr{opacity:.12;filter:grayscale(1)}\n.empty-msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px;color:var(--label2);font-size:12px;font-weight:500}\n.empty-msg svg{width:26px;height:26px}\n.plate.empty .empty-msg{display:flex}\n.data-line{width:100%;font-family:var(--mono);font-size:10.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;min-height:14px}\n.warn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--orange);font-weight:500}\n.warn svg{width:14px;height:14px;flex:0 0 auto}\n.actions{display:flex;flex-direction:column;gap:8px;width:100%}\n.btns{display:flex;gap:8px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;transition:transform .12s,opacity .2s}\n.btn svg{width:17px;height:17px}\n.btn:active{transform:scale(.97)}\n.btn:disabled{opacity:.4;pointer-events:none}\n.btn-primary{background:var(--blue);color:#fff;width:100%}\n.btn-tinted{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);flex:1}\n.btn-icon{flex:0 0 38px;padding:0}\n\n/* ---------- Toast ---------- */\n.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.2),0 0 0 .5px var(--sep);transition:all .28s cubic-bezier(.3,.7,.4,1);z-index:50}\n.toast svg{width:16px;height:16px;color:var(--green)}\n.toast.show{opacity:1;transform:translate(-50%,0)}\n\n/* ---------- Responsivo ---------- */\n@media (max-width:1180px) and (min-width:861px){\n  .work{grid-template-columns:minmax(0,1fr) 290px}\n  .cols{display:block;columns:2;column-gap:12px;overflow-y:auto}\n  .col{display:contents}\n  .card{break-inside:avoid;margin-bottom:12px}\n}\n@media (max-width:860px){\n  body{overflow:hidden}\n  .badge{display:none}\n  .work{display:flex;flex-direction:column;overflow-y:auto;padding:0 12px 16px;gap:12px}\n  .cols,.col,.pcol{display:contents}\n  .pcard{order:-1;position:sticky;top:0;z-index:4;margin:0 -12px;border-radius:0;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}\n  .plate{width:min(38vw,170px);max-width:none;padding:8px;flex:0 0 auto}\n  .pside{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}\n  .data-line{display:none}\n  .types{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}\n  .types::-webkit-scrollbar{display:none}\n  .type{flex:0 0 64px}\n  .card:first-of-type{margin-top:0}\n  .qcard{order:10}\n}\n@media (min-width:861px){.pside{display:contents}}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style>\n\u003cstyle>#themeBtn{display:none!important}\u003c/style>\n\u003cscript>\n(function(){\n  var orig = new WeakMap();\n  function walk(list, fn){\n    for 3cspan class=\"badge\">\u003cspan class=\"dot\">\u003c/span>QR estático, funciona para sempre\u003c/span>\n    \u003cbutton class=\"reset\" id=\"resetBtn\">Restaurar estilo\u003c/button>\n  \u003c/header>\n\n  \u003cdiv class=\"work\">\n    \u003cdiv class=\"cols\">\n      \u003c!-- COLUNA 1: o que o QR faz -->\n      \u003cdiv class=\"col\">\n        \u003csection class=\"card\">\n          \u003cdiv class=\"head\">\u003cspan class=\"step\">1\u003c/span>\u003ch2>Tipo\u003c/h2>\u003c/div>\n          \u003cdiv class=\"types\" id=\"types\" role=\"group\" aria-label=\"Tipo de QR Code\">\u003c/div>\n        \u003c/section>\n        \u003csection class=\"card\">\n          \u003cdiv class=\"head\">\u003cspan class=\"step\">2\u003c/span>\u003ch2>Conteúdo\u003c/h2>\u003cspan class=\"sub\" id=\"formTitle\">\u003c/span>\u003c/div>\n          \u003cdiv class=\"rows\" id=\"form\">\u003c/div>\n          \u003cp class=\"hint\" id=\"formHint\">\u003c/p>\n        \u003c/section>\n      \u003c/div>\n\n      \u003c!-- COLUNA 2: aparência do código -->\n      \u003cdiv class=\"col\">\n        \u003csection class=\"card\">\n          \u003cdiv class=\"head\">\u003cspan class=\"step\">3\u003c/span>\u003ch2>Estilo\u003c/h2>\u003c/div>\n          \u003cdiv class=\"sublbl\">Pontos\u003c/div>\n          \u003cdiv class=\"chips c5\" data-bind=\"dots\" id=\"dotsChoices\">\u003c/div>\n          \u003cdiv class=\"split\">\n            \u003cdiv>\u003cdiv class=\"sublbl\">Moldura dos cantos\u003c/div>\u003cdiv class=\"chips c3\" data-bind=\"cornerSq\" id=\"cornerSqChoices\">\u003c/div>\u003c/div>\n            \u003cdiv>\u003cdiv class=\"sublbl\">Centro dos cantos\u003c/div>\u003cdiv class=\"chips c3\" data-bind=\"cornerDot\" id=\"cornerDotChoices\">\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/section>\n        \u003csection class=\"card\">\n          \u003cdiv class=\"head\">\u003cspan class=\"step\">4\u003c/span>\u003ch2>Cores\u003c/h2>\u003c/div>\n          \u003cdiv class=\" \" y2=\"17\"/>\u003c/svg>\u003cspan id=\"warnText\">\u003c/span>\u003c/div>\n          \u003cdiv class=\"actions\">\n            \u003cbutton class=\"btn btn-primary dl\" id=\"dlPng\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/>\u003cpolyline points=\"7 10 12 15 17 10\"/>\u003cline x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"/>\u003c/svg>Baixar PNG\u003c/button>\n            \u003cdiv class=\"btns\">\n              \u003cbutton class=\"btn btn-tinted dl\" id=\"dlSvg\">SVG\u003c/button>\n              \u003cbutton class=\"btn btn-tinted btn-icon dl\" id=\"copyBtn\" aria-label=\"Copiar imagem\" title=\"Copiar imagem\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/>\u003cpath d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003c/button>\n              \u003cbutton class=\"btn btn-tinted btn-icon dl\" id=\"shareBtn\" aria-label=\"Compartilhar\" title=\"Compartilhar\" hidden>\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8\"/>\u003cpolyline points=\"16 6 12 2 8 6\"/>\u003cline x1=\"12\" y1=\"2\" x2=\"12\" y2=\"15\"/>\u003c/svg>\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"card qcard\">\n        \u003cdiv class=\"head\">\u003cspan class=\"step\">7\u003c/span>\u003ch2>Qualidade\u003c/h2>\u003c/div>\n        \u003cdiv class=\"sublbl\">Correção de erro\u003c/div>\n        \u003cdiv class=\"seg\" data-bind=\"ecl\">\u003cbutton data-v=\"L\">L 7%\u003c/button>\u003cbutton data-v=\"M\">M 15%\u003c/button>\u003cbutton data-v=\"Q\">Q 25%\u003c/button>\u003cbutton data-v=\"H\">H 30%\u003c/button>\u003c/div>\n        \u003cdiv class=\"sublbl\" style=\"margin-top:10px\">Margem \u003cspan data-out=\"margin\">\u003c/span>\u003c/div>\n        \u003cinput type=\"range\" min=\"0\" max=\"40\" step=\"1\" data-bind=\"margin\" aria-label=\"Margem\">\n        \u003cdiv class=\"sublbl\" style=\"margin-top:8px\">Tamanho do arquivo\u003c/div>\n        \u003cdiv class=\"seg\" data-bind=\"exportSize\">\u003cbutton data-v=\"512\">512\u003c/button>\u003cbutton data-v=\"1024\">1024\u003c/button>\u003cbutton data-v=\"2048\">2048\u003c/button>\u003cbutton data-v=\"4096\">4096\u003c/button>\u003c/div>\n        \u003cp class=\"hint\">Com ícone, a correção sobe para no mínimo Q. Para impressão, use SVG ou 2048 px ou mais.\u003c/p>\n      \u003c/section>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpolyline points=\"20 6 9 17 4 12\"/>\u003c/svg>\u003cspan id=\"toastText\">\u003c/span>\u003c/div>\n\n\u003cscript>\n(() => {\n/* ================= ÍCONES ================= */\nconst I = {\n  link:'\u003cpath d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/>\u003cpath d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/>',\n  text:'\u003cpath d=\"M4 7V4h16v3\"/>\u003cpath d=\"M9 20h6\"/>\u003cpath d=\"M12 4v16\"/>',\n  wifi:'\u003cpath d=\"M5 12.55a11 11 0 0 1 14.08 0\"/>\u003cpath d=\"M1.42 9a16 16 0 0 1 21.16 0\"/>\u003cpath d=\"M8.53 16.11a6 6 0 0 1 6.95 0\"/>\u003cpath d=\"M12 20h.01\"/>',\n  chat:'\u003cpath d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/>',\n  mail:'\u003crect x=\"2\" y=\"4\" width=\"20\" h 4-10z\"/>',\n  none:'\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m5.6 5.6 12.8 12.8\"/>',\n  upload:'\u003cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/>\u003cpolyline points=\"17 8 12 3 7 8\"/>\u003cline x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"/>'\n};\nconst svg = (n, sw=2) => `\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"${sw}\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${I[n]}\u003c/svg>`;\nconst esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n\n/* ================= TIPOS ================= */\nconst digits = s => (s||'').replace(/\\D/g,'');\nconst phoneClean = s => { s=(s||'').trim(); return (s.startsWith('+')?'+':'') + digits(s); };\nconst wifiEsc = s => (s||'').replace(/([\\\\;,:\"])/g,'\\\\$1');\nconst vEsc = s => (s||'').replace(/([\\\\;,])/g,'\\\\$1').replace(/\\n/g,'\\\\n');\nconst noAccent = s => (s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');\nfunction crc16(str){\n  let crc = 0xFFFF;\n  for (let i=0;i\u003cstr.length;i++){\n    crc ^= str.charCodeAt(i) \u003c\u003c 8;\n    for (let j=0;j\u003c8;j++) crc = (crc & 0x8000) ? ((crc\u003c\u003c1) ^ 0x1021) : (crc\u003c\u003c1);\n    crc &= 0xFFFF;\n  }\n  return crc.toString(16).toUpperCase().padStart(4,'0');\n}\nconst emv = (id,val) => id + String(val.length).padStart(2,'0') + val;\n\nconst TYPES = {\n  url:{label:'Link', icon:'link', hint:'Abre o endereço no navegador. O https:// é incluído se faltar.',\n    fields:[{k:'url',label:'Endereço',type:'url',ph:'seusite.com.br'}],\n    build:v=>{const u=(v.url||'').trim(); if(!u) return ''; return /^[a-z][a-z0-9+.-]*:/i.test(u)?u:'https://'+u;}},\n  text:{label:'Texto', icon:'text', hint:'Mostra o texto na tela de quem escanear.',\n    fields:[{k:'text',type:'textarea',ph:'Escreva sua mensagem'}],\n    build:v=>v.text||''},\n  whatsapp:{label:'WhatsApp', icon:'chat', hint:'Inclua o código do país e o DDD. Exemplo: 55 12 99999-0000.',\n    fields:[{k:'phone',label:'Número',type:'tel',ph:'55 12 99999-0000'},{k:'msg',type:'textarea',ph:'Mensagem inicial (opcional)'}],\n    build:v=>{const n=digits(v.phone); if(!n) return ''; return 'https://wa.me/'+n+(v.msg?'?text='+encodeURIComponent(v.msg):'');}},\n  wifi:{label:'Wi‑Fi', icon:'wifi', hint:'Quem escanear entra na rede sem digitar a senha.',\n    fields:[{k:'ssid',label:'Rede',type:'text',ph:'Nome da rede'},{k:'pass',label:'Senha',type:'password',ph:'Senha',hideIf:v=>v.enc==='nopass'},{k:'enc',type:'seg',opts:[['WPA','WPA/WPA2'],['WEP','WEP'],['nopass','Aberta']],def:'WPA'},{k:'hidden',label:'Rede oculta',type:'toggle'}],\n    build:v=>{if(!v.ssid) return ''; const enc=v.enc||'WPA'; return `WIFI:T:${enc};S:${wifiEsc(v.ssid)};${enc!=='nopass'?`P:${wifiEsc(v.pass)};`:''}${v.hidden?'H:true;':''};`;}},\n  pix:{label:'Pix', icon:'pix', hint:'Pix Copia e Cola estático. Chave de telefone no formato +5512999990000. Sem valor, quem paga digita a quantia.',\n    fields:[{k:'key',label:'Chave',type:'text',ph:'CPF, e-mail, telefone ou aleatória'},{k:'name',label:'Nome',type:'text',ph:'Nome do recebedor'},{k:'city',label:'Cidade',type:'text',ph:'São José dos Campos'},{k:'amount',label:'Valor (R$)',type:'number',ph:'Opcional'},{k:'desc',label:'Descrição',type:'text',ph:'Opcional'}],\n    build:v=>{\n      const key=(v.key||'').trim(); if(!key||!v.name||!v.city) return '';\n      const name=noAccent(v.name).trim().slice(0,25), city=noAccent(v.city).trim().slice(0,15);\n      const desc=noAccent(v.desc||'').trim().slice(0,40);\n      const amt=parseFloat(String(v.amount||'').replace(',','.'));\n      const mai=emv('00','br.gov.bcb.pix')+emv('01',key)+(desc?emv('02',desc):'');\n      const p=emv('00','01')+emv('26',mai)+emv('52','0000')+emv('53','986')+(amt>0?emv('54',amt.toFixed(2)):'')+emv('58','BR')+emv('59',name)+emv('60',city)+emv('62',emv('05','***'))+'6304';\n      return p+crc16(p);\n    }},\n  email:{label:'E-mail ush('URL:'+v.site.trim()); if(v.addr) L.push('ADR;TYPE=WORK:;;'+vEsc(v.addr)+';;;;');\n      L.push('END:VCARD'); return L.join('\\n');\n    }},\n  geo:{label:'Local', icon:'pin', hint:'Abre o ponto no app de mapas. Copie as coordenadas no Google Maps ou Apple Mapas.',\n    fields:[{k:'lat',label:'Latitude',type:'text',ph:'-23.1896'},{k:'lng',label:'Longitude',type:'text',ph:'-45.8841'},{k:'q',label:'Nome',type:'text',ph:'Opcional'}],\n    build:v=>{const la=parseFloat(String(v.lat||'').replace(',','.')), lo=parseFloat(String(v.lng||'').replace(',','.')); if(isNaN(la)||isNaN(lo)) return ''; return `geo:${la},${lo}`+(v.q?'?q='+encodeURIComponent(`${la},${lo}(${v.q})`):'');}}\n};\n\n/* ================= ESTADO ================= */\nconst DEFAULTS = {type:'url', fg:'#000000', bg:'#ffffff', gradient:false, fg2:'#007aff', gradType:'linear', transparent:false,\n  dots:'square', cornerSq:'square', cornerDot:'square', cornerColorOn:false, cornerColor:'#007aff',\n  icon:'none', iconStyle:'solid', customImg:null, iconSize:0.3, hideDots:true, ecl:'M', margin:10, exportSize:1024,\n  frame:'none', frameTop:'QR CODE', frameText:'ESCANEIE-ME', frameColor:'#000000', frameTextColor:'#ffffff'};\nlet state = JSON.parse(JSON.stringify(DEFAULTS));\nstate.values = {};\nconst $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];\n\n/* ================= OPÇÕES VISUAIS ================= */\nconst DOTS = [\n  ['square','Quadrado','\u003crect x=\"3\" y=\"3\" width=\"8\" height=\"8\"/>\u003crect x=\"13\" y=\"3\" width=\"8\" height=\"8\"/>\u003crect x=\"3\" y=\"13\" width=\"8\" height=\"8\"/>'],\n  ['dots','Pontos','\u003ccircle cx=\"7\" cy=\"7\" r=\"4\"/>\u003ccircle cx=\"17\" cy=\"7\" r=\"4\"/>\u003ccircle cx=\"7\" cy=\"17\" r=\"4\"/>'],\n  ['extra-rounded','Redondo','\u003crect x=\"3\" y=\"3\" width=\"8\" height=\"8\" rx=\"3\"/>\u003crect x=\"13\" y=\"3\" width=\"8\" height=\"8\" rx=\"3\"/>\u003crect x=\"3\" y=\"13\" width=\"8\" height=\"8\" rx=\"3\"/>'],\n  ['clas o',star:'Destaque'};\nconst PRESETS = [['#000000','#ffffff'],['#007aff','#ffffff'],['#1c1c1e','#e5e5ea'],['#5856d6','#ffffff'],['#af52de','#fbf5ff'],['#ff2d55','#ffffff'],['#ff9500','#fff8ef'],['#34c759','#ffffff'],['#0b4f3c','#eaf6ef'],['#ffffff','#000000'],['#ffd60a','#1c1c1e']];\nconst FRAMES = [\n  ['none','Sem moldura'],['banner','Faixas em cima e embaixo'],['card','Cartão com dois textos'],['card-top','Cartão com texto em cima'],\n  ['card-bottom','Cartão com texto embaixo'],['square','Borda reta'],['square-round','Borda arredondada'],['brackets','Cantos retos'],\n  ['brackets-round','Cantos arredondados'],['circle-double','Círculo duplo com texto'],['circle','Círculo com texto']\n];\nconst FRAME_HAS_TEXT = {banner:1,card:1,'card-top':1,'card-bottom':1,circle:1,'circle-double':1};\nconst FRAME_HAS_TOP = {banner:1,card:1};\nconst FRAME_TEXT_ON_FILL = {banner:1,card:1,'card-top':1,'card-bottom':1};\n\n/* ================= MOLDURAS (SVG) ================= */\nconst FONT = `font-family=\"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif\" font-weight=\"700\"`;\nfunction stext(x, y, str, fs, maxW, fill){\n  if (!str) return '';\n  const ls = fs*0.06, est = str.length*(fs*0.64+ls);\n  const fit = est > maxW ? ` textLength=\"${maxW}\" lengthAdjust=\"spacingAndGlyphs\"` : '';\n  return `\u003ctext x=\"${x}\" y=\"${y}\" ${FONT} font-size=\"${fs}\" letter-spacing=\"${ls}\" fill=\"${fill}\" text-anchor=\"middle\" dominant-baseline=\"central\"${fit}>${esc(str)}\u003c/text>`;\n}\n/* Retorna o tamanho total (W,H), a posição do QR (x,y) e os elementos da moldura */\nfunction frameDef(type, S, o){\n  const u = S/100, bg = o.transparent ? 'none' : o.bg, fc = o.fc, tc = o.tc;\n  switch(type){\n    case 'banner': {\n      const h=16*u, g=3*u, r=4*u, W=S, H=S+2*h+2*g;\n      const inner = (bg!=='none'?`\u003crect width=\"${W}\" height=\"${H}\" rx=\"${r}\" fill=\"${bg}\"/>`:'')\n        + `\u003crect width=\"${W}\" height=\"${h}\" rx=\"${r}\" fill=\"${fc}\"/>` + stext(W/2,h/2,o.top,7.5*u,W-12*u,tc)\n        + `\u003crect y=\"${H-h}\" width=\"${W}\" height=\"${h}\" rx=\"${r}\" fill=\"${fc}\"/>` + stext(W/2,H-h/2,o.text,7.5*u,W-12*u,tc);\n      return {W,H,x:0,y:h+g,inner};\n    }\n    case 'card': case 'card-top': case 'card-bottom': {\n      const top = type!=='card-bottom', bot = type!=='card-top';\n      const b=2.4*u, h=15*u, p=4*u, r=7*u, W=S+2*p, H=(top?h:0)+p+S+p+(bot?h:0);\n      let inner = `\u003crect x=\"${b/2}\" y=\"${b/2}\" width=\"${W-b}\" height=\"${H-b}\" rx=\"${r-b/2}\" fill=\"${bg}\"/>`;\n      if (top) inner += `\u003cpath d=\"M0 ${h}V${r}A${r} ${r} 0 0 1 ${r} 0H${W-r}A${r} ${r} 0 0 1 ${W} ${r}V${h}Z\" fill=\"${fc}\"/>` + stext(W/2,h/2,type==='card'?o.top:o.text,7*u,W-12*u,tc);\n      if (bot) inner += `\u003cpath d=\"M0 ${H-h}H${W}V${H-r}A${r} ${r} 0 0 1 ${W-r} ${H}H${r}A${r} ${r} 0 0 1 0 ${H-r}Z\" fill=\"${fc}\"/>` + stext(W/2,H-h/2,o.text,7*u,W-12*u,tc);\n      inner += `\u003crect x=\"${b/2}\" y=\"${b/2}\" width=\"${W-b}\" height=\"${H-b}\" rx=\"${r-b/2}\" fill=\"none\" stroke=\"${fc}\" stroke-width=\"${b}\"/>`;\n      return {W,H,x:p,y:(top?h:0)+p,inner};\n    }\n    case 'square': case 'square-round': {\n      const b=3*u, p=6*u, W=S+2*p, r=type==='square-round'?12*u:0;\n      return {W,H:W,x:p,y:p,inner:`\u003crect x=\"${b/2}\" y=\"${b/2}\" width=\"${W-b}\" height=\"${W-b}\" rx=\"${Math.max(0,r-b/2)}\" fill=\"${bg}\" stroke=\"${fc}\" stroke-width=\"${b}\"/>`};\n    }\n    case 'brackets': case 'brackets-round': {\n      const round = type==='brackets-round', p=9*u, W=S+2*p, a=2*u, L=22*u, sw=3.5*u, R=8*u, c=W/2;\n      const d = round ? `M${a} ${a+L}V${a+R}A${R} ${R} 0 0 1 ${a+R} ${a}H${a+L}` : `M${a} ${a+L}V${a}H${a+L}`;\n      let inner = bg!=='none' ? `\u003crect width=\"${W}\" height=\"${W}\" rx=\"${round?10*u:0}\" fill=\"${bg}\"/>` : '';\n      inner += [0,90,180,270].map(rot => `\u003cpath d=\"${d}\" transform=\"rotate(${rot} ${c} ${c})\" fill=\"none\" stroke=\"${fc}\" stroke-width=\"${sw}\" stroke-linecap=\"${round?'round':'square'}\" stroke-linejoin=\"${round?'round':'miter'}\"/>`).join('');\n      return {W,H:W,x:p,y:p,inner};\n    }\n    case 'circle': case 'circle-double': {\n      const dbl = type==='circle-double', D=S*Math.SQRT2+16*u, c=D/2, r1=c-2*u, r2=r1-5*u;\n      const rt = dbl ? r2-2.5*u : r1-4.5*u, fs = dbl ? 9*u : 8.5*u, id = 'qrp-arc-'+(o.id||'x');\n      let inner = `\u003cdefs>\u003cpath id=\"${id}\" d=\"M${c-rt} ${c}A${rt} ${rt} 0 0 0 ${c+rt} ${c}\" fill=\"none\"/>\u003c/defs>`;\n      inner += `\u003ccircle cx=\"${c}\" cy=\"${c}\" r=\"${r1}\" fill=\"${bg}\" stroke=\"${fc}\" stroke-width=\"${3*u}\"/>`;\n      if (dbl) inner += `\u003ccircle cx=\"${c}\" cy=\"${c}\" r=\"${r2}\" fill=\"none\" stroke=\"${fc}\" stroke-width=\"${1.2*u}\"/>`;\n      if (o.text){\n        const maxW = 72*u, est = o.text.length*(fs*0.7);\n        const fit = est > maxW ? ` textLength=\"${maxW}\" lengthAdjust=\"spacingAndGlyphs\"` : '';\n        inner += `\u003ctext ${FONT} font-size=\"${fs}\" letter-spacing=\"${fs*0.08}\" fill=\"${fc}\" text-anchor=\"middle\">\u003ctextPath href=\"#${id}\" xlink:href=\"#${id}\" startOffset=\"50%\"${fit}>${esc(o.text)}\u003c/textPath>\u003c/text>`;\n      }\n      return {W:D,H:D,x:c-S/2,y:c-S/2,inner};\n    }\n    default: return {W:S,H:S,x:0,y:0,inner:''};\n  }\n}\nfunction frameOpts(){\n  return {fc:state.frameColor, tc:state.frameTextColor, bg:state.bg, transparent:state.transparent, top:state.frameTop.trim(), text:state.frameText.trim()};\n}\nconst wrapSVG = (W,H,body) => `\u003csvg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"${W}\" height=\"${H}\" viewBox=\"0 0 ${W} ${H}\">${body}\u003c/svg>`;\nfunction frameThumb(type){\n  if (type==='none') return svg('none',1.6);\n  const f = frameDef(type, 100, {fc:'currentColor', tc:'var(--card)', bg:'none', transparent:true, top:'QR CODE', text:'ESCANEIE', id:type});\n  const q = (x,y) => `\u003crect x=\"${x}\" y=\"${y}\" width=\"24\" height=\"24\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"6\"/>\u003crect x=\"${x+8}\" y=\"${y+8}\" width=\"8\" height=\"8\" fill=\"currentColor\"/>`;\n  const ph = `\u003cg transform=\"translate(${f.x} ${f.y})\" opacity=\".5\">${q(10,10)}${q(66,10)}${q(10,66)}\u003crect x=\"46\" y=\"46\" width=\"10\" height=\"10\" fill=\"currentColor\"/>\u003crect x=\"66\" y=\"66\" width=\"10\" height=\"10\" fill=\"currentColor\"/>\u003crect x=\"80\" y=\"54\" width=\"8\" height=\"8\" fill=\"currentColor\"/>\u003c/g>`;\n  return `\u003csvg viewBox=\"-4 -4 ${f.W+8} ${f.H+8}\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\">${f.inner}${ph}\u003c/svg>`;\n}\n\n/* ================= UI ================= */\nfunction buildTypes(){\n  $('#types').innerHTML = Object.entries(TYPES).map(([k,t]) =>\n    `\u003cbutton class=\"type\" data-type=\"${k}\" aria-pressed=\"${state.type===k}\">\u003cspan class=\"ic\">${svg(t.icon)}\u003c/span>${t.label}\u003c/button>`).join('');\n  $$('#types .type').forEach(b => b.onclick = () => {\n    state.type = b.dataset.type;\n    $$('#types .type').forEach(x => x.setAttribute('aria-pressed', x===b));\n    buildForm(); schedule();\n  });\n}\nfunction buildForm(){\n  const t = TYPES[state.type];\n  const v = state.values[state.type] ||= {};\n  t.fields.forEach(f => { if(f.def!==undefined && v[f.k]===undefined) v[f.k]=f.def; });\n  $('#formTitle').textContent = t.label;\n  $('#formHint').textContent = t.hint || '';\n  $('#form').innerHTML = t.fields.map(f => {\n    const hide = f.hideIf && f.hideIf(v) ? ' hidden' : '';\n    if (f.type==='textarea') return `\u003cdiv class=\"row ta\" data-fk=\"${f.k}\"${hide}>\u003ctextarea data-f=\"${f.k}\" placeholder=\"${f.ph||''}\" aria-label=\"${f.ph||''}\">${esc(v[f.k])}\u003c/textarea>\u003c/div>`;\n    if (f.type==='seg') return `\u003cdiv class=\"row\" data-fk=\"${f.k}\"${hide}>\u003cdiv class=\"seg\" data-fseg=\"${f.k}\">${f.opts.map(([val,l])=>`\u003cbutton data-v=\"${val}\" aria-pres
