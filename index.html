/300;\n  const grad = state.gradient ? {type:state.gradType, rotation:Math.PI/4, colorStops:[{offset:0,color:state.fg},{offset:1,color:state.fg2}]} : undefined;\n  const corner = state.cornerColorOn ? {color:state.cornerColor} : (grad ? {gradient:grad} : {color:state.fg});\n  const o = {\n    width:size, height:size, type, data, margin:Math.round(state.margin*scale),\n    qrOptions:{errorCorrectionLevel:effectiveEcl()},\n    dotsOptions:grad ? {type:state.dots, gradient:grad} : {type:state.dots, color:state.fg},\n    cornersSquareOptions:{type:state.cornerSq, ...corner},\n    cornersDotOptions:{type:state.cornerDot, ...corner},\n    backgroundOptions:{color: state.transparent ? 'rgba(0,0,0,0)' : state.bg},\n    imageOptions:{crossOrigin:'anonymous', margin:Math.round(4*scale), imageSize:state.iconSize, hideBackgroundDots:state.hideDots}\n  };\n  const img = iconImage(); if (img) o.image = img;\n  return o;\n}\nconst loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });\n\n/* Monta QR + moldura. Retorna um canvas (PNG) ou um Blob SVG */\nasync function compose(S, fmt, data){\n  const f = frameDef(state.frame, S, frameOpts());\n  if (fmt==='svg'){\n    const qrBlob = await new QRCodeStyling(options(S,'svg',data)).getRawData('svg');\n    if (state.frame==='none') return qrBlob;\n    let t = (await qrBlob.text()).replace(/\u003c\\?xml[^>]*\\?>/,'');\n    t = t.replace(/\u003csvg\\b/, `\u003csvg x=\"${f.x}\" y=\"${f.y}\"`);\n    return new Blob([wrapSVG(f.W, f.H, f.inner + t)], {type:'image/svg+xml'});\n  }\n  const qrBlob = await new QRCodeStyling(options(S,'canvas',data)).getRawData('png');\n  const url = URL.createObjectURL(qrBlob);\n  try{\n    const qrImg = await loadImg(url);\n    const cv = document.createElement('canvas');\n    cv.width = Math.ceil(f.W); cv.height = Math.ceil(f.H);\n    const ctx = cv.getContext('2d');\n    if (f.inner){\n      const fr = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(wrapSVG(f.W, f.H, f.inner)));\n      ctx.drawImage(fr, 0, 0, f.W, f.H);\n    }\n    ctx.drawImage(qrImg, f.x, f.y, S, S);\n    return cv;\n  } finally { URL.revokeObjectURL(url); }\n}\n\nlet currentData = '', timer, renderId = 0;\nfunction schedule(){ clearTimeout(timer); timer = setTimeout(render, 100); }\nfunction lum(hex){ const c=hex.replace('#',''); const rgb=[0,2,4].map(i=>parseInt(c.substr(i,2),16)/255).map(v=>v\u003c=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)); return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]; }\nfunction contrast(a,b){ const A=lum(a),B=lum(b); return (Math.max(A,B)+.05)/(Math.min(A,B)+.05); }\n\nasync function render(){\n  const plate = $('#plate');\n  if (typeof QRCodeStyling==='undefined'){\n    $('#emptyText').textContent='Não foi possível carregar o gerador. Verifique a conexão e recarregue a página.';\n    plate.classList.add('empty'); setButtons(false); return;\n  }\n  const id = ++renderId;\n  const data = TYPES[state.type].build(state.values[state.type]||{});\n  currentData = data;\n  const empty = !data;\n  $('#emptyText').textContent = 'Preencha o conteúdo para gerar o QR Code';\n  $('#dataLine').textContent = empty ? '' : data.replace(/\\n/g,' ⏎ ');\n  try{\n    const cv = await compose(560, 'png', data || 'https://exemplo.com.br');\n    if (id !== renderId) return;\n    const box = $('#qr'); box.innerHTML = ''; box.appendChild(cv);\n    plate.classList.toggle('empty', empty);\n    setButtons(!empty);\n  }catch(err){\n    if (id !== renderId) return;\n    plate.classList.add('empty');\n    $('#emptyText').textContent = 'Conteúdo longo demais para um QR Code. Reduza o texto ou a correção de erro.';\n    setButtons(false);\n  }\n  const warns = [];\n  const bgRef = state.transparent ? '#ffffff' : state.bg;\n  if (!state.transparent){\n    const fgRef = state.gradient ? (lum(state.fg)>lum(state.fg2)?state.fg:state.fg2) : state.fg;\n    if (contrast(fgRef,bgRef) \u003c 3) warns.push('Contraste baixo: earance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:#fff;\n  box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)\n}\ninput[type=range]::-moz-range-thumb{\n  width:28px;height:28px;border:0;border-radius:50%;background:#fff;\n  box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12)\n}\n.presets{display:flex;gap:6px;flex-wrap:wrap}\n.chip{height:28px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;color:var(--label)}\n.chip[aria-pressed=\"true\"]{background:var(--blue);color:#fff}\n.chip:active{opacity:.7}\n\n/* Text field */\n.field{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:48px}\n.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:17px;padding:12px 0}\n.field input::placeholder{color:var(--label3)}\n.clear-x{width:20px;height:20px;border-radius:50%;background:var(--label3);color:var(--card);display:none;place-items:center;flex:none}\n.clear-x.on{display:grid}\n\n/* Segmented control */\n.seg{\n  position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--fill);border-radius:9px;padding:2px;height:32px;flex:1;max-width:280px\n}\n.seg button{position:relative;z-index:1;font-size:13px;font-weight:500;border-radius:7px;transition:color .2s}\n.seg button[aria-checked=\"true\"]{font-weight:600}\n.seg .knob{\n  position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/4);border-radius:7px;background:var(--card);\n  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .28s cubic-bezier(.3,.7,.4,1)\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]) .seg .knob{background:#636366}}\n:root[data-theme=\"dark\"] .seg .knob{background:#636366}\n\n/* History */\n.hist-row{cursor:pointer;width:100%;text-align:left}\n.hist-row:active{background:var(--fill)}\n.hist-pw{font-family:var(--mono);font-size:15px;flex:1;min-w adding:0 14px;min-height:64px;\n  box-shadow:inset 0 0 0 .5px var(--sep)}\n.chk-field:focus-within{box-shadow:inset 0 0 0 2px var(--blue)}\n.chk-field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:var(--mono);\n  font-size:clamp(20px,2.6vw,28px);letter-spacing:.02em;padding:14px 0}\n.chk-field input::placeholder{font-family:var(--font);font-size:17px;letter-spacing:0;color:var(--label3)}\n.crack-hero{display:flex;flex-direction:column;gap:4px;padding-top:4px;border-top:.5px solid var(--sep);padding-top:16px}\n.crack-hero span{font-size:13px;color:var(--label2)}\n.crack-hero strong{font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-.01em;line-height:1.15;transition:color .3s}\n.crack-hero small{font-size:13px;color:var(--label2)}\n.comp{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}\n.tile{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}\n.tile b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}\n.tile span{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.tile.off b{color:var(--label3)}\n.req-ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:var(--label3);transition:background .25s}\n.req-ico.ok{background:var(--green)}\n.req-ico.bad{background:var(--red)}\n.req-ico.warn{background:var(--orange)}\n.req-ico.tip{background:var(--blue)}\n.row .row-text span.sub{font-size:13px;color:var(--label2);font-family:var(--font);letter-spacing:0;white-space:normal}\n.row.req::before{left:52px!important}\n.att-time{font-size:15px;font-weight:600;text-align:right;flex:none;max-width:48%;font-variant-numeric:tabular-nums}\n.feed-empty{padding:14px 16px;color:var(--label2);font-size:15px}\n\n/* ---------- Responsive ---------- */\n@media (max-width: 899px){\n  .main{display:flex;flex-direction:column;gap:22px;overflow-y:auto;overscroll-behavior:contain;padding-bottom:0}\n  .col{overflow:visible;min-height:auto;padding-bottom:0;flex:none}\n  .col-left{display:contents}\n  .col-left .hero{order:1}\n  .main > .col:not(.col-left){order:2}\n  #histGroup{order:3;padding-bottom:8px}\n  .actions-wrap{\n    order:99;position:sticky;bottom:0;z-index:3;margin:auto calc(-1 * clamp(16px,4vw,40px)) 0;\n    padding:12px clamp(16px,4vw,40px) 14px;background:var(--nav);\n    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);\n    border-top:.5px solid var(--sep)\n  }\n  .kbd-hint{display:none}\n  #chkView{padding-bottom:24px}\n}\n@media (max-width: 680px){\n  .nav{grid-template-columns:1fr auto}\n  .tabs{grid-row:2;grid-column:1/-1;width:100%}\n}\n@media (max-width: 520px){\n  .nav p{display:none}\n  .nav h1{font-size:24px}\n  .comp{grid-template-columns:repeat(5,1fr);gap:6px}\n  .tile{padding:10px 6px;align-items:center;text-align:center}\n  .tile b{font-size:20px}\n  .tile span{font-size:11px}\n  .btn{height:50px;font-size:16px}\n  .actions{gap:8px}\n  .pill-btn .pb-t{display:none}\n  .pill-btn{width:32px;padding:0;justify-content:center}\n  .seg{max-width:none}\n}\n@media (max-height: 700px) and (min-width: 900px){\n  .pw{min-height:2em}\n  .hero{gap:14px}\n}\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}\n}\n\u003c/style>\n\u003cstyle>#themeBtn{display:none!important}\u003c/style>\n\u003cscript>\n(function(){\n  var orig = new WeakMap();\n  function walk(list, fn){\n    for (var i = 0; i \u003c list.length; i++){\n      var r = list[i];\n      if (r.media && typeof r.media.mediaText === 'string' && r.cssRules) fn(r);\n      if (r.cssRules) { try { walk(r.cssRules, fn); } catch(e){} }\n    }\n  }\n  function apply(mode){\n    var de = document.documentElement;\n    if (mode === 'light' || mode === 'dark') de.setAttribute('data-theme', mode); else de.removeAttribute('data-theme');\n    de.style.colorScheme = (mode === 'light' || mode === 'dark') ? mode : '';\n    for (var s = 0; s \u003c document.styleSheets.length; s++){\n      var rules; try { rules = document.styleSheets[s].cssRules; } catch(e){ continue; }\n      walk(rules, function(r){\n        var o = orig.get(r);\n        if (o === undefined){ o = r.media.mediaText; orig.set(r, /prefers-color-scheme/.test(o) ? o : null); o = orig.get(r); }\n        if (o === null) return;\n        var t = o;\n        if (mode === 'light' || mode === 'dark'){\n          t = o.replace(/\\(\\s*prefers-color-scheme\\s*:\\s*(dark|light)\\s*\\)/g, function(m, v){\n            return v === mode ? '(min-width: 0px)' : '(max-width: -1px)';\n          });\n        }\n        if (r.media.mediaText !== t) r.media.mediaText = t;\n      });\n    }\n  }\n  window.__honraTheme = apply;\n  try { apply(window.parent.__honraMode || 'auto'); } catch(e){}\n  window.addEventListener('load', function(){ try { apply(window.parent.__honraMode || 'auto'); } catch(e){} });\n  document.addEventListener('keydown', function(e){\n    if (e.key === 'Escape') { try { window.parent.postMessage({ honra: 'esc' }, '*'); } catch(_){} }\n  });\n})();\n\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cheader class=\"nav\">\n    \u003cdiv class=\"nav-title\">\n      \u003cdiv class=\"app-icon\" aria-hidden=\"true\">\n        \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"8\" cy=\"15\" r=\"4\"/>\u003cpath d=\"M10.8 12.2 20 3M17 6l2.5 2.5M14.5 8.5 16.5 10.5\"/>\u003c/svg>\n      \u003c/div>\n      \u003cdiv>\n        \u003ch1 id=\"navTitle\">Gerador de senhas\u003c/h1>\n        \u003cp id=\"navSub\">Gerado no seu dispositivo. Nada é enviado ou salvo.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"tabs\" id=\"tabs\" role=\"tablist\" aria-label=\"Escolha a ferramenta\">\n      \u003cspan class=\"knob\" id=\"tabKnob\">\u003c/span>\n      \u003cbutton type=\"button\" role=\"tab\" data-view=\"gen\" aria-selected=\"true\" aria-controls=\"genView\">\n        \u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"8\" cy=\"15\" r=\"4\"/>\u003cpath d=\"M10.8 12.2 20 3M17 6l2.5 2.5\"/>\u003c/svg>Gerar\u003c/button>\n      \u003cbutton type=\"button\" role=\"tab\" data-view=\"chk\" aria-selected=\"false\" aria-controls=\"chkView\">\n        \u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3z\"/>\u003cpath d=\"m9 12 2 2 4-4\"/>\u003c/svg>Verificar\u003c/button>\n    \u003c/div>\n    \u003cbutton class=\"pill-btn\" id=\"themeBtn\" type=\"button\" aria-label=\"Alternar tema\">\n      \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\">\u003cpath d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/>\u003c/svg>\n      \u003cspan class=\"pb-t\" id=\"themeTxt\">Tema\u003c/span>\n    \u003c/button>\n  \u003c/header>\n\n  \u003cmain class=\"main view\" id=\"genView\" role=\"tabpanel\">\n    \u003c!-- Left: result + actions -->\n    \u003csection class=\"col col-left\" aria-label=\"Senha gerada\">\n      \u003cdiv class=\"left-inner\" style=\"display:contents\">\n      \u003cdiv class=\"hero\">\n        \u003cdiv class=\"pw-top\">\n          \u003cspan class=\"mode-tag\" id=\"modeTag\">\u003ci>\u003c/i>\u003cspan id=\"modeTxt\">Aleatória\u003c/span>\u003c/span>\n          \u003cdiv class=\"icon-btns\">\n            \u003cbutton class=\"icon-btn\" id=\"eyeBtn\" type=\"button\" aria-label=\"Ocultar senha\" aria-pressed=\"false\">\n              \u003csvg id=\"eyeIco\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003c/svg>\n            \u003c/button>\n            \u003cbutton class=\"icon-btn\" id=\"toChk\" type=\"button\" aria-label=\"Verificar esta senha\" title=\"Verificar esta senha\">\n              \u003csvg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3z\"/>\u003cpath d=\"m9 12 2 2 4-4\"/>\u003c/svg>\n            \u003c/button>\n            \u003cbutton class=\"icon-btn\" id=\"copyBtn\" type=\"button\" aria-label=\"Copiar senha\">\n              \u003csvg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2.5\"/>\u003cpath d=\"M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5\"/>\u003c/svg>\n            \u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"pw\" id=\"pw\" aria-live=\"polite\" tabindex=\"0\" title=\"Clique para copiar\">\u003c/div>\n\n        \u003cdiv class=\"strength\">\n          \u003cdiv class=\"meter\" id=\"meter\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n          \u003cdiv class=\"strength-row\">\n            \u003cspan class=\"strength-label\" id=\"strLabel\">—\u003c/span>\n            \u003cspan class=\"strength-meta\" id=\"strMeta\">\u003c/span>\n          \u003c/div>\n          \u003cp class=\"crack\" id=\"crack\">\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"actions-wrap\">\n        \u003cdiv class=\"actions\">\n          \u003cbutton class=\"btn btn-primary\" id=\"genBtn\" type=\"button\">\n            \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M21 12a9 9 0 1 1-3-6.7L21 8\"/>\u003cpath d=\"M21 3v5h-5\"/>\u003c/svg>\n            Gerar\n          \u003c/button>\n          \u003cbutton class=\"btn btn-tint\" id=\"rndBtn\" type=\"button\">\n            \u003csvg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"/>\u003ccircle cx=\"8\" cy=\"8\" r=\"1.3\" fill=\"currentColor\"/>\u003ccircle cx=\"16\" cy=\"8\" r=\"1.3\" fill=\"currentColor\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"1.3\" fill=\"currentColor\"/>\u003ccircle cx=\"8\" cy=\"16\" r=\"1.3\" fill=\"currentColor\"/>\u003ccircle cx=\"16\" cy=\"16\" r=\"1.3\" fill=\"currentColor\"/>\u003c/svg>\n            Aleatório\n          \u003c/button>\n          \u003cbutton class=\"btn btn-indigo\" id=\"styBtn\" type=\"button\">\n            \u003csvg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m4 20 11-11M13 7l4 4\"/>\u003cpath d=\"M19 3v4M17 5h4M8 3v2M7 4h2M20 13v2M19 14h2\"/>\u003c/svg>\n            Estilizado\n          \u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cp class=\"kbd-hint\">Enter gera uma nova senha. Ctrl/⌘ + C copia.\u003c/p>\n\n      \u003cdiv class=\"group\" id=\"histGroup\">\n        \u003cdiv class=\"group-head\">\n          \u003ch2 class=\"group-title\">Geradas nesta sessão\u003c/h2>\n          \u003cbutton class=\"link-btn\" id=\"clearHist\" type=\"button\">Limpar\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"list\" id=\"hist\">\u003c/div>\n        \u003cp class=\"group-foot\">Toque em uma senha para copiá-la. O histórico some ao fechar a página.\u003c/p>\n      \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- Right: settings -->\n    \u003csection class=\"col\" aria-label=\"Configurações\">\n      \u003cdiv class=\"group\">\n        \u003cdiv class=\"group-head\">\u003ch2 class=\"group-title\">Número de caracteres\u003c/h2>\u003c/div>\n        \u003cdiv class=\"list\">\n          \u003cdiv class=\"len-block\">\n            \u003cdiv class=\"len-top\">\n              \u003cdiv class=\"len-num\">\n                \u003coutput id=\"lenOut\" for=\"len\">16\u003c/output>\n                \u003cspan>caracteres\u003c/span>\n                \u003cspan class=\"len-level\" id=\"lenLevel\">Forte\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"stepper\">\n                \u003cbutton type=\"button\" id=\"dec\" aria-label=\"Diminuir\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\">\u003cpath d=\"M2 7h10\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>\u003c/button>\n                \u003ci>\u003c/i>\n                \u003cbutton type=\"button\" id=\"inc\" aria-label=\"Aumentar\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\">\u003cpath d=\"M2 7h10M7 2v10\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>\u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"slider-wrap\">\n              \u003csmall>0\u003c/small>\n              \u003cinput type=\"range\" id=\"len\" min=\"0\" max=\"50\" value=\"16\" aria-label=\"Número de caracteres da senha\">\n              \u003csmall>50\u003c/small>\n            \u003c/div>\n            \u003cdiv class=\"presets\" id=\"presets\">\n              \u003cbutton class=\"chip\" type=\"button\" data-v=\"8\">8\u003c/button>\n              \u003cbutton class=\"chip\" type=\"button\" data-v=\"12\">12\u003c/button>\n              \u003cbutton class=\"chip\" type=\"button\" data-v=\"16\">16\u003c/button>\n              \u003cbutton class=\"chip\" type=\"button\" data-v=\"24\">24\u003c/button>\n              \u003cbutton class=\"chip\" type=\"button\" data-v=\"32\">32\u003c/button>\n              \u003cbutton class=\"chip\" type=\"button\" data-v=\"50\">50\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"group-foot\" id=\"lenTip\">Recomendamos 16 ou mais caracteres para contas importantes.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"group\">\n        \u003cdiv class=\"group-head\">\u003ch2 class=\"group-title\">Caracteres utilizados\u003c/h2>\u003c/div>\n        \u003cdiv class=\"list\" id=\"sets\">\n          \u003clabel class=\"row\" data-set=\"upper\">\n            \u003cspan class=\"row-ico\" style=\"background:var(--blue)\">A\u003c/span>\n            \u003cspan class=\"row-text\">Letra maiúscula\u003csmall>A B C D … Z\u003c/small>\u003c/span>\n            \u003cspan class=\"switch\">\u003cinput type=\"checkbox\" id=\"upper\" checked>\u003cspan>\u003c/span>\u003c/span>\n          \u003c/label>\n          \u003clabel class=\"row\" data-set=\"lower\">\n            \u003cspan class=\"row-ico\" style=\"background:var(--indigo)\">a\u003c/span>\n            \u003cspan class=\"row-text\">Letra minúscula\u003csmall>a b c d … z\u003c/small>\u003c/span>\n            \u003cspan class=\"switch\">\u003cinput type=\"checkbox\" id=\"lower\" checked>\u003cspan>\u003c/span>\u003c/span>\n          \u003c/label>\n          \u003clabel class=\"row\" data-set=\"digits\">\n            \u003cspan class=\"row-ico\" style=\"background:var(--green)\">1\u003c/span>\n            \u003cspan class=\"row-text\">Números\u003csmall>0 1 2 3 … 9\u003c/small>\u003c/span>\n            \u003cspan class=\"switch\">\u003cinput type=\"checkbox\" id=\"digits\" checked>\u003cspan>\u003c/span>\u003c/span>\n          \u003c/label>\n          \u003clabel class=\"row\" data-set=\"symbols\">\n            \u003cspan class=\"row-ico\" style=\"background:var(--orange)\">#\u003c/span>\n            \u003cspan class=\"row-text\">Símbolos\u003csmall>! @ # $ % &amp; * ? + = …\u003c/small>\u003c/span>\n            \u003cspan class=\"switch\">\u003cinput type=\"checkbox\" id=\"symbols\" checked>\u003cspan>\u003c/span>\u003c/span>\n          \u003c/label>\n          \u003clabel class=\"row\">\n            \u003cspan class=\"row-ico\" style=\"background:#8E8E93\">\n              \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m6 6 12 12\"/>\u003c/svg>\n            \u003c/span>\n            \u003cspan class=\"row-text\">Evitar ambíguos\u003csmall>sem l 1 I O 0 o | ` ' \"\u003c/small>\u003c/span>\n            \u003cspan class=\"switch\">\u003cinput type=\"checkbox\" id=\"ambig\">\u003cspan>\u003c/span>\u003c/span>\n          \u003c/label>\n        \u003c/div>\n        \u003cp class=\"group-foot\" id=\"setsFoot\">Cada tipo ativo aparece pelo menos uma vez na senha.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"group\">\n        \u003cdiv class=\"group-head\">\u003ch2 class=\"group-title\">Senha estilizada\u003c/h2>\u003c/div>\n        \u003cdiv class=\"list\">\n          \u003cdiv class=\"row full field\" id=\"baseRow\">\n            \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--label2)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 7V5h16v2M9 19h6M12 5v14\"/>\u003c/svg>\n            \u003cinput id=\"base\" type=\"text\" placeholder=\"Palavra ou frase de base\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" maxlength=\"40\" aria-label=\"Palavra ou frase de base\">\n            \u003cbutton class=\"clear-x\" id=\"clearBase\" type=\"button\" aria-label=\"Limpar texto\">\n              \u003csvg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\">\u003cpath d=\"m2 2 6 6M8 2 2 8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\u003c/svg>\n            \u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"row full\">\n            \u003cspan class=\"row-text\">Separador\u003c/span>\n            \u003cdiv class=\"seg\" id=\"seg\" role=\"radiogroup\" aria-label=\"Separador entre palavras\">\n              \u003cspan class=\"knob\" id=\"knob\">\u003c/span>\n              \u003cbutton type=\"button\" role=\"radio\" data-sep=\"-\" aria-checked=\"true\">-\u003c/button>\n              \u003cbutton type=\"button\" role=\"radio\" data-sep=\".\" aria-checked=\"false\">.\u003c/button>\n              \u003cbutton type=\"button\" role=\"radio\" data-sep=\"_\" aria-checked=\"false\">_\u003c/button>\n              \u003cbutton type=\"button\" role=\"radio\" data-sep=\"\" aria-checked=\"false\">Nenhum\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"group-foot\">Transforma sua frase com trocas como a→4, e→3, s→$, maiúsculas variadas e completa até o comprimento escolhido. Mais fácil de lembrar, porém menos imprevisível que uma senha aleatória.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cmain class=\"main view\" id=\"chkView\" role=\"tabpanel\" hidden>\n    \u003csection class=\"col\" aria-label=\"Senha a verificar\">\n      \u003cdiv class=\"hero\">\n        \u003cdiv class=\"pw-top\">\n          \u003cspan class=\"mode-tag chk\">\u003ci>\u003c/i>\u003cspan>Análise no dispositivo\u003c/span>\u003c/span>\n          \u003cdiv class=\"icon-btns\">\n            \u003cbutton class=\"icon-btn\" id=\"cEye\" type=\"button\" aria-label=\"Mostrar senha\" aria-pressed=\"false\">\n              \u003csvg id=\"cEyeIco\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.8M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.8 0 3.3-.5 4.6-1.2\"/>\u003cpath d=\"M9.9 9.9a3 3 0 0 0 4.2 4.2\"/>\u003c/svg>\n            \u003c/button>\n            \u003cbutton class=\"icon-btn\" id=\"cPaste\" type=\"button\" aria-label=\"Colar senha\" title=\"Colar\">\n              \u003csvg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2.5\"/>\u003cpath d=\"M9 4V3h6v1\"/>\u003cpath d=\"M9 11h6M9 15h4\"/>\u003c/svg>\n            \u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003clabel class=\"chk-field\">\n          \u003cinput id=\"cInput\" type=\"password\" placeholder=\"Digite ou cole uma senha\" autocomplete=\"off\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" maxlength=\"128\" aria-label=\"Senha a verificar\">\n          \u003cbutton class=\"clear-x\" id=\"cClear\" type=\"button\" aria-label=\"Limpar\">\n            \u003csvg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\">\u003cpath d=\"m2 2 6 6M8 2 2 8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\u003c/svg>\n          \u003c/button>\n        \u003c/label>\n\n        \u003cdiv class=\"strength\">\n          \u003cdiv class=\"meter\" id=\"cMeter\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n          \u003cdiv class=\"strength-row\">\n            \u003cspan class=\"strength-label\" id=\"cLabel\" aria-live=\"polite\">—\u003c/span>\n            \u003cspan class=\"strength-meta\" id=\"cMeta\">\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"crack-hero\">\n          \u003cspan>Tempo estimado para quebrar\u003c/span>\n          \u003cstrong id=\"cTime\">—\u003c/strong>\n          \u003csmall>Considerando um vazamento de dados e 10 bilhões de tentativas por segundo.\u003c/small>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"comp\" id=\"cComp\" aria-label=\"Composição da senha\">\n        \u003cdiv class=\"tile\">\u003cb data-k=\"len\">0\u003c/b>\u003cspan>Total\u003c/span>\u003c/div>\n        \u003cdiv class=\"tile\">\u003cb data-k=\"upper\">0\u003c/b>\u003cspan>Maiúsculas\u003c/span>\u003c/div>\n        \u003cdiv class=\"tile\">\u003cb data-k=\"lower\">0\u003c/b>\u003cspan>Minúsculas\u003c/span>\u003c/div>\n        \u003cdiv class=\"tile\">\u003cb data-k=\"digits\">0\u003c/b>\u003cspan>Números\u003c/span>\u003c/div>\n        \u003cdiv class=\"tile\">\u003cb data-k=\"symbols\">0\u003c/b>\u003cspan>Símbolos\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cbutton class=\"btn btn-tint\" id=\"cUseGen\" type=\"button\">\n        \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"8\" cy=\"15\" r=\"4\"/>\u003cpath d=\"M10.8 12.2 20 3M17 6l2.5 2.5\"/>\u003c/svg>\n        Testar a última senha gerada\n      \u003c/button>\n      \u003cp class=\"group-foot\">A senha é analisada somente neste dispositivo. Ela não é enviada, registrada nem salva.\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"col\" aria-label=\"Resultado da análise\">\n      \u003cdiv class=\"group\">\n        \u003cdiv class=\"group-head\">\u003ch2 class=\"group-title\">Requisitos\u003c/h2>\u003cspan class=\"group-title\" id=\"cReqCount\">\u003c/span>\u003c/div>\n        \u003cdiv class=\"list\" id=\"cReq\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"group\">\n        \u003cdiv class=\"group-head\">\u003ch2 class=\"group-title\">Problemas e sugestões\u003c/h2>\u003c/div>\n        \u003cdiv class=\"list\" id=\"cFeed\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"group\">\n        \u003cdiv class=\"group-head\">\u003ch2 class=\"group-title\">Tempo por tipo de ataque\u003c/h2>\u003c/div>\n        \u003cdiv class=\"list\" id=\"cAtt\">\u003c/div>\n        \u003cp class=\"group-foot\">Estimativas com a biblioteca zxcvbn, que procura palavras comuns, nomes, datas, sequências e padrões de teclado.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\n  \u003cspan class=\"tick\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\">\u003cpath d=\"m3 7.5 2.5 2.5L11 4.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/span>\n  \u003cspan id=\"toastTxt\">Senha copiada\u003c/span>\n\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js\" async id=\"zxScript\">\u003c/script>\n\u003cscript>\n(function(){\n  \"use strict\";\n  const $ = id => document.getElementById(id);\n\n  const SETS = {\n    upper:\"ABCDEFGHIJKLMNOPQRSTUVWXYZ\",\n    lower:\"abcdefghijklmnopqrstuvwxyz\",\n    digits:\"0123456789\",\n    symbols:\"!@#$%&*?+=-_^~()[]{}\u003c>;:,./\"\n  };\n  const AMBIG = \"Il1O0o|`'\\\"\";\n  const LEET = { a:[\"4\",\"@\"], e:[\"3\"], i:[\"1\",\"!\"], o:[\"0\"], s:[\"5\",\"$\"], t:[\"7\"], b:[\"8\"], g:[\"9\"], l:[\"1\"], z:[\"2\"] };\n\n  const state = {\n    pw:\"\", bits:0, mode:\"random\", base:\"\", hidden:false, sep:\"-\", history:[]\n  };\n\n  /* ---------- Secure random ---------- */\n  const buf = new Uint32Array(1);\n  function rint(n){\n    if(n \u003c= 1) return 0;\n    const lim = Math.floor(0x100000000 / n) * n;\n    let x;\n    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= lim);\n    return x % n;\n  }\n  const pick = s => s[rint(s.length)];\n  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rint(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }\n\n  /* ---------- Options ---------- */\n  const opt = () => ({\n    upper:$(\"upper\").checked, lower:$(\"lower\").checked,\n    digits:$(\"digits\").checked, symbols:$(\"symbols\").checked,\n    ambig:$(\"ambig\").checked, len:+$(\"len\").value\n  });\n  function strip(s, o){ return o.ambig ? [...s].filter(c => !AMBIG.includes(c)).join(\"\") : s; }\n  function pools(o){\n    return [\"upper\",\"lower\",\"digits\",\"symbols\"].filter(k => o[k]).map(k => strip(SETS[k], o));\n  }\n\n  /* ---------- Generators ---------- */\n  function genRandom(o){\n    const ps = pools(o), all = ps.join(\"\");\n    if(!o.len || !all) return { pw:\"\", bits:0 };\n    const out = [];\n    if(o.len >= ps.length) ps.forEach(p => out.push(pick(p)));\n    while(out.length \u003c o.len) out.push(pick(all));\n    return { pw: shuffle(out).slice(0, o.len).join(\"\"), bits: o.len * Math.log2(all.length) };\n  }\n\n  function genStyled(o, base, sep){\n    const words = base.normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\")\n      .replace(/[^A-Za-z0-9\\s]/g,\" \").trim().split(/\\s+/).filter(Boolean);\n    if(!words.length) return null;\n    let bits = words.length * 11; // ~ palavra de dicionário\n    const parts = words.map(w => {\n      return [...w.toLowerCase()].map((c, i) => {\n        let ch = c;\n        const sub = LEET[c];\n        if(sub){\n          const cands = sub.filter(x => /\\d/.test(x) ? o.digits : o.symbols)\n                           .filter(x => !(o.ambig && AMBIG.includes(x)));\n          if(cands.length && rint(2)){ ch = pick(cands); bits += 1; }\n          else if(cands.length) bits += 1;\n        }\n        if(/[a-z]/.test(ch)){\n          if(o.upper && o.lower){ if(i === 0 || rint(4) === 0) ch = ch.toUpperCase(); bits += .8; }\n          else if(o.upper) ch = ch.toUpperCase();\n        }\n        return ch;\n      }).join(\"\");\n    });\n    const core = parts.join(sep);\n\n    const fillPool = pools(o).join(\"\") || SETS.lower;\n    const need = Math.max(0, o.len - core.length);\n    const filler = [];\n    if(need > 0){\n      if(o.digits && !/\\d/.test(core)) filler.push(pick(strip(SETS.digits,o)));\n      if(o.symbols && ![...core].some(c => SETS.symbols.includes(c))) filler.push(pick(strip(SETS.symbols,o)));\n      while(filler.length \u003c need) filler.push(pick(fillPool));\n      filler.length = need;\n      shuffle(filler);\n      bits += need * Math.log2(fillPool.length) + 1;\n    }\n    // espalha o complemento entre início e fim\n    const cut = filler.length ? rint(Math.ceil(filler.length / 2) + 1) : 0;\n    const pre = filler.slice(0, cut).join(\"\"), suf = filler.slice(cut).join(\"\");\n    const pw = (pre ? pre + sep : \"\") + core + (suf ? sep + suf : \"\");\n    return { pw, bits };\n  }\n\n  /* ---------- Strength ---------- */\n  const LEVELS = [\n    { max:0,  name:\"Sem senha\",   color:\"var(--label3)\", seg:0 },\n    { max:28, name:\"Muito fraca\", color:\"var(--red)\",    seg:1 },\n    { max:36, name:\"Fraca\",       color:\"var(--orange)\", seg:2 },\n    { max:60, name:\"Razoável\",    color:\"var(--yellow)\", seg:3 },\n    { max:80, name:\"Forte\",       color:\"var(--green)\",  seg:4 },\n    { max:Infinity, name:\"Muito forte\", color:\"var(--green)\", seg:5 }\n  ];\n  const level = b => b \u003c= 0 ? LEVELS[0] : LEVELS.find((l,i) => i > 0 && b \u003c l.max);\n  const nf = new Intl.NumberFormat(\"pt-BR\", { maximumFractionDigits:0 });\n  function crackTime(bits){\n    if(bits \u003c= 0) return \"\";\n    const s = Math.pow(2, bits - 1) / 1e10; // 10 bilhões de tentativas por segundo\n    const plural = (n, a, b) => `${nf.format(n)} ${n === 1 ? a : b}`;\n    if(s \u003c 1) return \"instantaneamente\";\n    if(s \u003c 60) return plural(Math.round(s), \"segundo\", \"segundos\");\n    if(s \u003c 3600) return plural(Math.round(s/60), \"minuto\", \"minutos\");\n    if(s \u003c 86400) return plural(Math.round(s/3600), \"hora\", \"horas\");\n    if(s \u003c 31536000) return plural(Math.round(s/86400), \"dia\", \"dias\");\n    const y = s / 31536000;\n    if(y \u003c 1000) return plural(Math.round(y), \"ano\", \"anos\");\n    if(y \u003c 1e6) return `${nf.format(Math.round(y/1e3))} mil anos`;\n    if(y \u003c 1e9) return `${nf.format(Math.round(y/1e6))} milhões de anos`;\n    if(y \u003c 1e12) return `${nf.format(Math.round(y/1e9))} bilhões de anos`;\n    return \"mais de 1 trilhão de anos\";\n  }\n  function levelFor(o){ // nível previsto para o comprimento atual (aleatória)\n    const pool = pools(o).join(\"\").length;\n    return level(o.len * Math.log2(Math.max(pool, 1)));\n  }\n\n  /* ---------- Render ---------- */\n  function esc(c){ return c === \"\u003c\" ? \"&lt;\" : c === \">\" ? \"&gt;\" : c === \"&\" ? \"&amp;\" : c === '\"' ? \"&quot;\" : c; }\n  function colorize(pw){\n    return [...pw].map(c => /\\d/.test(c) ? `\u003cspan class=\"d\">${c}\u003c/span>`\n      : /[A-Za-z]/.test(c) ? c : `\u003cspan class=\"y\">${esc(c)}\u003c/span>`).join(\"\");\n  }\n  function sizeClass(n){ return n > 34 ? \"s\" : n > 20 ? \"m\" : \"\"; }\n\n  function renderPw(text){\n    const el = $(\"pw\");\n    el.className = \"pw \" + sizeClass(state.pw.length);\n    if(!state.pw){\n      el.classList.add(\"empty\");\n      el.textContent = +$(\"len\").value === 0 ? \"Aumente o número de caracteres para gerar uma senha.\" : \"Toque em Gerar para criar uma senha.\";\n      return;\n    }\n    if(state.hidden){ el.classList.add(\"hidden\"); el.textContent = \"•\".repeat(state.pw.length); return; }\n    el.innerHTML = colorize(text ?? state.pw);\n  }\n\n  function renderStrength(){\n    const L = level(state.bits);\n    [...$(\"meter\").children].forEach((s, i) => s.style.background = i \u003c L.seg ? L.color : \"\");\n    $(\"strLabel\").textContent = L.name;\n    $(\"strLabel\").style.color = L.seg ? L.color : \"var(--label2)\";\n comp.len} caracteres, ~${Math.max(0, Math.round(a.bits))} bits`;\n    $(\"cTime\").textContent = empty ? \"—\" : fmtSeconds(a.guesses / 1e10);\n    $(\"cTime\").style.color = empty ? \"var(--label3)\" : L.color;\n\n    $(\"cComp\").querySelectorAll(\"b\").forEach(b => {\n      const v = a.comp[b.dataset.k];\n      b.textContent = v;\n      b.parentElement.classList.toggle(\"off\", !v);\n    });\n\n    // requisitos\n    const st = cond => empty ? \"idle\" : cond ? \"ok\" : \"bad\";\n    const reqs = [\n      [st(a.comp.len >= 12), \"Pelo menos 12 caracteres\", empty ? \"\" : a.comp.len >= 16 ? \"Ótimo, 16 ou mais.\" : a.comp.len >= 12 ? \"Bom. O ideal é 16 ou mais.\" : `Faltam ${12 - a.comp.len}.`],\n      [st(a.comp.upper > 0), \"Letra maiúscula\", \"\"],\n      [st(a.comp.lower > 0), \"Letra minúscula\", \"\"],\n      [st(a.comp.digits > 0), \"Números\", \"\"],\n      [st(a.comp.symbols > 0), \"Símbolos\", \"\"],\n      [st(!a.flags.repeat), \"Sem caracteres repetidos em sequência\", \"Como aaa ou 111\"],\n      [st(!a.flags.seq && !a.flags.kb), \"Sem sequências ou padrões de teclado\", \"Como abc, 123 ou qwerty\"],\n      [st(!a.flags.date), \"Sem datas ou anos\", \"Como 1990 ou 12/05\"],\n      [st(!a.exactCommon && !a.baseCommon), \"Não é uma senha comum\", \"Comparada a senhas populares, inclusive em português\"]\n    ];\n    $(\"cReq\").innerHTML = reqs.map(r => reqRow(...r)).join(\"\");\n    const okN = reqs.filter(r => r[0] === \"ok\").length;\n    $(\"cReqCount\").textContent = empty ? \"\" : `${okN} de ${reqs.length}`;\n\n    // feedback\n    if(empty){\n      $(\"cFeed\").innerHTML = '\u003cdiv class=\"feed-empty\">Digite ou cole uma senha para ver a análise.\u003c/div>';\n    } else {\n      const items = a.warnings.map(w => reqRow(\"warn\", w, \"\")).concat(a.sugg.map(s => reqRow(\"tip\", s, \"\")));\n      $(\"cFeed\").innerHTML = items.length ? items.join(\"\") : reqRow(\"ok\", \"Nenhum problema encontrado.\", \"\");\n    }\n\n    // ataques\n    $(\ n  .topbar p{font-size:14px}\n  .view{padding:4px 16px 28px}\n  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--sep);padding:6px 0 calc(4px + env(safe-area-inset-bottom))}\n  .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--label2);padding:2px 0;position:relative}\n  .tab .i{width:25px;height:25px;stroke-width:1.9}\n  .tab.active{color:var(--blue)}\n  .rl{width:110px;font-size:16px}\n  .in{font-size:16px}\n}\n@media (max-width:420px){.rl{width:96px}.kk{width:120px}.btn-row .btn{flex:1}}\n\n/* ---------- Sheet & toast ---------- */\n.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .2s ease}\n.sheet{background:var(--bg);width:100%;max-width:660px;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:up .32s cubic-bezier(.2,.8,.2,1)}\n.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--sep);background:var(--bg2)}\n.sheet-h b{font-size:17px;font-weight:600}\n.sheet-h .link-btn{justify-self:start}\n.sheet-h .link-btn:last-child{justify-self:end;font-weight:600}\n.sheet-b{padding:16px}\n.sheet-b textarea{width:100%;min-height:230px;border:0;border-radius:12px;background:var(--bg2);padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical;outline:none}\n.sheet-b .sf{padding:10px 4px 0}\n@media (max-width:640px){.backdrop{align-items:flex-end;padding:0}.sheet{border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)}}\n@keyframes fade{from{opacity:0}}\n@keyframes up{from{transform:translateY(40px);opacity:0}}\n.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--toast);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);padding:10px 20px 10px 12px;border-radius:24px;display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;box-shadow:0 10px 34px rgba(0,0,0,.2);z-index:60;transition:transform .38s cubic-bezier(.2,.9,.3,1.15);pointer-events:none;max-width:calc(100vw - 32px)}\n.toast.show{transform:translate(-50%,0)}\n.toast i{width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}\n.toast.err i{background:var(--red)}\n.toast i .i{stroke:#fff;width:14px;height:14px;stroke-width:3}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}\n\u003c/style>\n\u003cstyle>#themeBtn{display:none!important}\u003c/style>\n\u003cscript>\n(function(){\n  var orig = new WeakMap();\n  function walk(list, fn){\n    for (var i = 0; i \u003c list.length; i++){\n      var r = list[i];\n      if (r.media && typeof r.media.mediaText === 'string' && r.cssRules) fn(r);\n      if (r.cssRules) { try { walk(r.cssRules, fn); } catch(e){} }\n    }\n  }\n  function apply(mode){\n    var de = document.documentElement;\n    if (mode === 'light' || mode === 'dark') de.setAttribute('data-theme', mode); else de.removeAttribute('data-theme');\n    de.style.colorScheme = (mode === 'light' || mode === 'dark') ? mode : '';\n    for (var s = 0; s \u003c document.styleSheets.length; s++){\n      var rules; try { rules = document.styleSheets[s].cssRules; } catch(e){ continue; }\n      walk(rules, function(r){\n        var o = orig.get(r);\n        if (o === undefined){ o = r.media.mediaText; orig.set(r, /prefers-color-scheme/.test(o) ? o : null); o = orig.get(r); }\n        if (o === null) return;\n        var t = o;\n        if (mode === 'light' || mode === 'dark'){\n          t = o.replace(/\\(\\s*prefers-color-scheme\\s*:\\s*(dark|light)\\s*\\)/g, function(m, v){\n            return v === mode ? '(min-width: 0px)' : '(max-width: -1px)';\n          });\n        }\n        if (r.media.mediaText !== t) r.media.mediaText = t;\n      });\n    }\n  }\n  window.__honraTheme = apply;\n  try { apply(window.parent.__honraMode || 'auto'); } catch(e){}\n  window.addEventListener('load', function(){ try { apply(window.parent.__honraMode || 'auto'); } catch(e){} });\n  document.addEventListener('keydown', function(e){\n    if (e.key === 'Escape') { try { window.parent.postMessage({ honra: 'esc' }, '*'); } catch(_){} }\n  });\n})();\n\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003caside class=\"sidebar\" aria-label=\"Navegação\">\n    \u003cdiv class=\"brand\">\n      \u003cdiv class=\"app-icon\" data-ic=\"link\">\u003c/div>\n      \u003cdiv>\u003cstrong>Gerador de UTM\u003c/strong>\u003cspan>Links rastreáveis para o GA4\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cnav class=\"side-nav\">\n      \u003cbutton class=\"nav-item\" data-view=\"single\">\u003cspan class=\"tile\" style=\"--c:#007AFF\" data-ic=\"link\">\u003c/span>Individual\u003c/button>\n      \u003cbutton class=\"nav-item\" data-view=\"batch\">\u003cspan class=\"tile\" style=\"--c:#34C759\" data-ic=\"rows\">\u003c/span>Em lote\u003cspan class=\"badge\" id=\"rowsBadge\">\u003c/span>\u003c/button>\n      \u003cbutton class=\"nav-item\" data-view=\"qr\">\u003cspan class=\"tile\" style=\"--c:#5856D6\" data-ic=\"qr\">\u003c/span>QR Code\u003c/button>\n      \u003cbutton class=\"nav-item\" data-view=\"history\">\u003cspan class=\"tile\" style=\"--c:#FF9500\" data-ic=\"clock\">\u003c/span>Histórico\u003cspan class=\"badge\" id=\"histBadge\">\u003c/span>\u003c/button>\n      \u003cbutton class=\"nav-item\" data-view=\"guide\">\u003cspan class=\"tile\" style=\"--c:#30B0C7\" data-ic=\"book\">\u003c/span>Guia de preenchimento\u003c/button>\n    \u003c/nav>\n    \u003cdiv class=\"side-foot\">Tudo fica salvo apenas neste navegador. Nenhum link é enviado para servidores.\u003c/div>\n  \u003c/aside>\n\n  \u003cmain class=\"main\">\n    \u003cheader class=\"topbar\">\n      \u003cdiv>\u003ch1 id=\"title\">Link individual\u003c/h1>\u003cp id=\"subtitle\">\u003c/p>\u003c/div>\n      \u003cdiv class=\"top-actions\" id=\"topActions\">\u003c/div>\n    \u003c/header>\n\n    \u003c!-- INDIVIDUAL -->\n    \u003csection class=\"view\" id=\"view-single\">\n      \u003cdiv class=\"single-grid\">\n        \u003cdiv class=\"col form-col\">\n          \u003cdiv class=\"section\">\n            \u003cdiv class=\"sh\">Página de destino\u003c/div>\n            \u003cdiv class=\"group\">\n              \u003clabel class=\"row\">\u003cspan class=\"rl\">URL\u003csmall>obrigatório\u003c/small>\u003c/span>\u003cinput class=\"in url\" id=\"urlIn\" type=\"url\" inputmode=\"url\" placeholder=\"https://seusite.com.br/pagina\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\">\u003c/label>\n            \u003c/div>\n            \u003cdiv class=\"sf\">Parâmetros que já existem na URL, como ?ref=, são mantidos.\u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"section\">\n            \u003cdiv class=\"sh\">Modelo de canal \u003cbutton class=\"link-btn\" type=\"button\" data-guide=\"channel\">Guia do canal\u003c/button>\u003c/div>\n            \u003cdiv class=\"dd\" id=\"ddSingle\">\u003c/div>\n            \u003cdiv class=\"group tip\" id=\"dynGroup\">\n              \u003clabel class=\"row toggle\">\u003cspan class=\"rl grow\">Parâmetros dinâmicos\u003csmall>Valores que a plataforma preenche no clique\u003c/small>\u003c/span>\u003cspan class=\"sw\">\u003cinput type=\"checkbox\" id=\"dynSw\">\u003cspan>\u003c/span>\u003c/span>\u003c/label>\n            \u003c/div>\n            \u003cdiv class=\"sf\" id=\"presetTip\">\u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"section\">\n            \u003cdiv class=\"sh\">Parâmetros da campanha \u003cbutton class=\"link-btn\" type=\"button\" data-guide=\"params\">Ver exemplos\u003c/button>\u003c/div>\n            \u003cdiv class=\"group\" id=\"paramGroup\">\u003c/div>\n            \u003cdiv class=\"sf\">Origem, mídia e campanha são obrigatórios para o GA4 atribuir o tráfego corretamente.\u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"section\">\n            \u003cdetails class=\"group\" id=\"advBox\">\n              \u003csummary class=\"row\">\u003cspan class=\"rl grow\">Parâmetros avançados do GA4\u003c/span>\u003csvg class=\"i chev\" viewBox=\"0 0 24 24\">\u003cpath d=\"M9 6l6 6-6 6\"/>\u003c/svg>\u003c/summary>\n              \u003cdiv class=\"sepfirst\" id=\"advRows\">\u003c/div>\n            \u003c/details>\n            \u003cdiv class=\"sf\">Plataforma, formato do criativo e tática aparecem nas dimensões de campanha manual do GA4.\u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"section\">\n            \u003cdiv class=\"sh\">Parâmetros personalizados\u003c/div>\n            \u003cdiv class=\"group\">\n              \u003cdiv id=\"customRows\">\u003c/div>\n              \u003cbutton class=\"row addrow\" id=\"addCustom\" type=\"button\" data-ic=\"plus\">Adicionar parâmetro\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"sf\">Para parâmetros próprios, como ref, cupom ou utm_affiliate.\u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"section\">\n            \u003cdiv class=\"sh\">Formatação\u003c/div>\n            \u003cdiv class=\"group\" data-fmt-box>\u003c/div>\n            \u003cdiv class=\"sf\">Padronizar evita que \"Instagram\" e \"instagram\" virem linhas diferentes nos relatórios. Parâmetros dinâmicos não são alterados.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003caside class=\"col result-col\" aria-live=\"polite\">\n          \u003cdiv class=\"sh\">Seu link\u003c/div>\n          \u003cdiv class=\"result-card\">\n            \u003cdiv class=\"seg full\" id=\"outMode\">\u003cbutton data-m=\"full\" type=\"button\">URL completa\u003c/button>\u003cbutton data-m=\"query\" type=\"button\">Só parâmetros\u003c/button>\u003c/div>\n            \u003cdiv class=\"url-box\" id=\"urlBox\">\u003c/div>\n            \u003cdiv class=\"btn-row\">\n              \u003cbutton class=\"btn primary\" id=\"copyBtn\" data-ic=\"copy\">Copiar link\u003c/button>\n              \u003cbutton class=\"btn tinted\" id=\"openBtn\" data-ic=\"open\" title=\"Abrir o link numa nova aba\">Testar\u003c/button>\n              \u003cbutton class=\"btn tinted\" id=\"shareBtn\" data-ic=\"share\">Enviar\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"len\" id=\"lenInfo\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"warns\" id=\"warns\">\u003c/div>\n\n          \u003cdiv class=\"section\">\n            \u003cdiv class=\"sh\">Como o GA4 vai ler\u003c/div>\n            \u003cdiv class=\"group\">\n              \u003cdiv class=\"row\">\u003cspan class=\"rl grow\">Canal padrão previsto\u003c/span>\u003cspan id=\"chPill\" class=\"rv\">\u003c/span>\u003c/div>\n              \u003cdiv class=\"sepfirst\" id=\"kv\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"sf\">Previsão baseada nas regras do grupo de canais padrão do GA4.\u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"section\">\n            \u003cdiv class=\"sh\">QR Code\u003c/div>\n            \u003cdiv class=\"group\">\n              \u003cdiv class=\"mini-qr\">\n                \u003cdiv class=\"mq-box\">\u003ccanvas id=\"miniQR\" width=\"84\" height=\"84\">\u003c/canvas>\u003c/div>\n                \u003cdiv>\u003cp>Use este link em impressos, embalagens, vitrines e eventos.\u003c/p>\u003cbutton class=\"btn tinted sm\" id=\"toQR\" data-ic=\"qr\">Personalizar e baixar\u003c/button>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/aside>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- LOTE -->\n    \u003csection class=\"view\" id=\"view-batc se();trig.focus();}\n    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const l=opts();const i=l.indexOf(document.activeElement);const n=e.key==='ArrowDown'?Math.min(l.length-1,i+1):Math.max(0,i-1);if(l[n])l[n].focus();}\n    else if(e.key==='Enter'&&e.target===q){e.preventDefault();const f=opts()[0];if(f)f.click();}\n  });\n  DDS.push({root,close});\n  paint();\n  return{paint,close};\n}\nlet ddS,ddM;\nfunction renderPresets(){\n  if(ddS)ddS.paint();\n  const p=P[S.single.preset];\n  $('#dynGroup').hidden=!p.dyn; $('#dynSw').checked=S.single.dynamic;\n  $('#presetTip').textContent=p.tip||'';\n}\nfunction applyPreset(id){\n  const p=P[id]; if(!p)return; S.single.preset=id; const f=S.single.f;\n  ORDER.forEach(k=>{if(isMacro(f[k]))f[k]=''});\n  Object.assign(f,p.v);\n  if(p.dyn&&S.single.dynamic)Object.entries(p.dyn).forEach(([k,v])=>{if(!f[k])f[k]=v});\n  syncSingle(); renderPresets(); update(); persist();\n}\nfunction renderCustom(){\n  $('#customRows').innerHTML=S.single.custom.map(c=>`\u003cdiv class=\"row\" data-cid=\"${c.id}\">\u003cbutton type=\"button\" class=\"minus\" data-cdel aria-label=\"Remover parâmetro\">\u003c/button>\u003cinput class=\"in\" data-c=\"k\" value=\"${esc(c.k)}\" placeholder=\"nome\" style=\"flex:0 1 38%\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\">\u003cspan class=\"eq\">=\u003c/span>\u003cinput class=\"in\" data-c=\"v\" value=\"${esc(c.v)}\" placeholder=\"valor\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\">\u003c/div>`).join('');\n}\nfunction syncSingle(){\n  $('#urlIn').value=S.single.url;\n  $$('#view-single [data-k]').forEach(i=>i.value=S.single.f[i.dataset.k]||'');\n  renderCustom();\n}\nfunction singlePairs(){\n  const f=S.single.f; const pairs=ORDER.map(k=>[k,norm(f[k])]);\n  S.single.custom.forEach(c=>{const k=(c.k||'').trim();if(k)pairs.push([k,norm(c.v)])});\n  return pairs;\n}\nfunction colorize(str,isQuery){\n  let base='',rest=str,hash='';\n  if(!isQuery){const q o gclid ativo, o GA4 usa os dados do Google Ads. As UTMs ainda ajudam outras ferramentas a ler a origem.'],\n  ['#8E8E93','#','Guarde o histórico','Registre os links criados com data e responsável. O Histórico e o CSV do modo Em lote servem para isso.']\n];\nconst GCH=[['Pesquisa paga','Origem de buscador (google, bing) e mídia cpc, ppc ou paid*'],['Social pago','Origem de rede social (facebook, instagram, tiktok) e mídia paga (cpc, paid_social)'],['Vídeo pago','Origem de vídeo (youtube, vimeo) e mídia paga (cpc, cpv)'],['Display','Mídia display, banner, cpm, expandable ou interstitial'],['Social orgânico','Origem de rede social ou mídia social, social-media, sm'],['Vídeo orgânico','Origem de vídeo ou mídia contendo video'],['Pesquisa orgânica','Origem de buscador ou mídia organic'],['E-mail','Origem ou mídia email, e-mail ou e_mail'],['Afiliados','Mídia affiliate'],['Referência','Mídia referral, app ou link'],['SMS','Origem ou mídia sms'],['Notificações push','Mídia terminando em push, ou contendo mobile ou notification'],['Não atribuído','Qualquer combinação fora das regras acima']];\nconst SAMPLE='https://seusite.com.br/oferta?utm_source=instagram&utm_medium=paid_social&utm_campaign=black_friday_2026&utm_id=bf26&utm_content=story_video_15s';\nfunction guideParams(){\n  return `\u003cp class=\"g-intro\">Cada parâmetro responde a uma pergunta sobre o clique: de onde veio, por qual canal, em qual campanha e com qual peça. Origem, mídia e campanha são obrigatórios; os demais detalham a análise.\u003c/p>\n  \u003cdiv class=\"g-sample\">\u003cdiv class=\"g-label\">Exemplo completo\u003c/div>\u003cdiv class=\"url-box\">${colorize(SAMPLE,false)}\u003c/div>\u003c/div>\n  \u003cdiv class=\"g-grid\">${GP.map(g=>`\u003cdiv class=\"g-card\">\u003cdiv class=\"g-head\">\u003cspan class=\"g-code\">${g.k}\u003c/span>\u003cspan class=\"g-name\">${g.n}\u003c/span>\u003cspan class=\"g-badge ${g.req?'req':''}\">${g.req?'Obrigatório':'Opcional'}\u003c/span>\u003c/div>\n    \u003cp>${g.d}\u003c/p>\n    \u003cdiv>\u003cdiv class=\"g-label\">Exemplos\u003c/div>\u003cdiv class=\"g-ex\">${g.ex.map(e=>`\u003ccode>${esc(e)}\u003c/code>`).join('')}\u003c/div>\u003c/div>\n    \u003cdiv>\u003cdiv class=\"g-label\">Onde aparece no GA4\u003c/div>\u003cspan class=\"g-mono\">${g.dim}\u003c/span>\u003c/div>\n    \u003cdiv class=\"g-tip\">${g.tip}\u003c/div>\u003c/div>`).join('')}\u003c/div>`;\n}\nfunction guideChannels(){\n  return `\u003cp class=\"g-intro\">Valores recomendados, onde colar o link e quais parâmetros cada plataforma preenche sozinha. Use o botão de cada cartão para aplicar o modelo no link individual.\u003c/p>\n  \u003cdiv class=\"g-grid\">${PRESETS.filter(p=>p.id!=='custom').map(p=>{\n    const f=Object.assign({utm_campaign:'black_friday_2026'},p.v,p.dyn||{});\n    const url=buildUrl('https://seusite.com.br/oferta',ORDER.map(k=>[k,f[k]||''])).url;\n    const ck=channel(p.v.utm_source,p.v.utm_medium,'');\n    return `\u003cdiv class=\"g-card\" id=\"g-ch-${p.id}\">\u003cdiv class=\"g-ch-top\">${tileHTML(p)}\u003cspan class=\"dd-txt\">\u003cb>${p.name}\u003c/b>\u003csmall>${esc(cap(p))}\u003c/small>\u003c/span>\u003cspan class=\"pill\" style=\"--pc:${CH[ck][2]}\">${CH[ck][0]}\u003c/span>\u003c/div>\n      \u003ctable class=\"g-table\">\u003ctr>\u003ctd>utm_source\u003c/td>\u003ctd>${esc(p.v.utm_source)}\u003c/td>\u003c/tr>\u003ctr>\u003ctd>utm_medium\u003c/td>\u003ctd>${esc(p.v.utm_medium)}\u003c/td>\u003c/tr>\u003c/table>\n      \u003cdiv>\u003cdiv class=\"g-label\">Onde colar\u003c/div>\u003cp>${WHERE[p.id]||''}\u003c/p>\u003c/div>\n      ${p.dyn?`\u003cdiv>\u003cdiv class=\"g-label\">Parâmetros dinâmicos\u003c/div>\u003ctable class=\"g-table\">${Object.entries(p.dyn).map(([k,v])=>`\u003ctr>\u003ctd>${k}\u003c/td>\u003ctd>\u003cspan class=\"g-mono\">${esc(v)}\u003c/span> ${MACRO[v]||''}\u003c/td>\u003c/tr>`).join('')}\u003c/table>\u003c/div>`:''}\n      ${p.tip?`\u003cdiv class=\"g-tip\">${esc(p.tip)}\u003c/div>`:''}\n      \u003cdiv>\u003cdiv class=\"g-label\">Exemplo\u003c/div>\u003cdiv class=\"g-urlmini\">${colorize(url,false)}\u003c/div>\u003c/div>\n      \u003cdiv class=\"g-foot\">\u003cbutton class=\"btn tinted sm\" type=\"button\" data-use=\"${p.id}\">Usar este modelo\u003c/button>\u003c/div>\u003c/div>`}).join('')}\u003c/div>`;\n}\nfunction guideBatch(){\n  const ex={url:'https://seusite.com.br/oferta',utm_source:'google',utm_medium:'cpc',utm_campaign:'black_friday_2026',utm_content:'anuncio_texto',utm_term:'tenis_corrida',utm_id:'bf26'};\n  return `\u003cp class=\"g-intro\">O modo Em lote cria vários links de uma vez. Todos passam pela mesma formatação configurada, e você exporta o resultado para planilha.\u003c/p>\n  \u003cdiv class=\"g-steps\">\n    \u003cdiv class=\"g-step\">\u003ch3>Gere por canais\u003c/h3>\u003cp>Informe URL e campanha, escolha os canais no dropdown e toque em Adicionar. Cada canal vira uma linha com origem e mídia preenchidas.\u003c/p>\u003c/div>\n    \u003cdiv class=\"g-step\">\u003ch3>Cole da planilha\u003c/h3>\u003cp>Copie as células no Excel ou no Google Planilhas e cole em Colar planilha, ou direto em qualquer célula da tabela.\u003c/p>\u003c/div>\n    \u003cdiv class=\"g-step\">\u003ch3>Importe um CSV\u003c/h3>\u003cp>Baixe o modelo CSV, preencha uma linha por link e importe. Vírgula, ponto e vírgula e tabulação são aceitos.\u003c/p>\u003c/div>\n    \u003cdiv class=\"g-step\">\u003ch3>Revise e exporte\u003c/h3>\u003cp>A coluna Link final mostra o resultado ou o que falta. Depois copie os links, copie a tabela ou baixe o CSV.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sh\">Colunas aceitas\u003c/div>\n  \u003cdiv class=\"g-wrap\">\u003ctable class=\"g-table\">\u003ctr>\u003cth>Coluna\u003c/th>\u003cth>Também reconhecida como\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>${BCOLS.map(([k,l])=>`\u003ctr>\u003ctd>${l} \u003cspan class=\"g-mono\">${k}\u003c/span>\u003c/td>\u003ctd>${HMAP[k].filter(a=>a!==k).join(', ')}\u003c/td>\u003ctd>\u003cspan class=\"g-mono\">${esc(ex[k])}\u003c/span>\u003c/td>\u003c/tr>`).join('')}\u003c/table>\u003c/div>\n  \u003cdiv class=\"sf\" style=\"margin-bottom:22px\">Sem cabeçalho, a ordem das colunas precisa ser: URL, origem, mídia, campanha, conteúdo, termo e ID. Colunas extras são ignoradas.\u003c/div>\n  \u003cdiv class=\"btn-row\">\u003cbutton class=\"btn primary sm\" type=\"button\" data-gtpl data-ic=\"filedown\">Baixar modelo CSV\u003c/button>\u003cbutton class=\"btn tinted sm\" type=\"button\" data-go=\"batch\">Ir para Em lote\u003c/button>\u003c/div>`;\n}\nfunction guideTips(){\n  return `\u003cp class=\"g-intro\">Regras simples que mantêm os relatórios limpos e comparáveis ao longo do tempo.\u003c/p>\n  \u003cdiv class=\"g-rules\">${GTIPS.map(([c,s,t,d])=>`\u003cdiv class=\"g-rule\" style=\"--rc:${c}\">\u003cspan class=\"dot\">${s}\u003c/span>\u003cdiv>\u003cb>${t}\u003c/b>\u003cspan>${d}\u003c/span>\u003c/div>\u003c/div>`).join('')}\u003c/div>\n  \u003cdiv class=\"sh\">Como o GA4 define o canal padrão\u003c/div>\n  \u003cdiv class=\"g-wrap\">\u003ctable class=\"g-table\">\u003ctr>\u003cth>Canal\u003c/th>\u003cth>Regra simplificada\u003c/th>\u003c/tr>${GCH.map(([a,b])=>`\u003ctr>\u003ctd>${a}\u003c/td>\u003ctd>${b}\u003c/td>\u003c/tr>`).join('')}\u003c/table>\u003c/div>\n  \u003cdiv class=\"sf\">As regras são aplicadas em ordem. Uma origem de rede social com mídia paga vira Social pago antes de ser avaliada como Social orgânico.\u003c/div>`;\n}\nfunction renderGuide(){\n  S.guideTab=S.guideTab||'params';\n  $$('#gSeg button').forEach(b=>b.classList.toggle('on',b.dataset.g===S.guideTab));\n  $('#gBody').innerHTML=({params:guideParams,channels:guideChannels,batch:guideBatch,tips:guideTips}[S.guideTab]||guideParams)();\n  $$('#gBody [data-ic]').forEach(el=>el.insertAdjacentHTML('afterbegin',ic(el.dataset.ic)));\n}\nfunction openGuide(tab,anchor){\n  S.guideTab=tab;renderGuide();setView('guide');\n  const v=$('#view-guide');\n  if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView({block:'start'});el.style.boxShadow='0 0 0 2px var(--blue)';setTimeout(()=>el.style.boxShadow='',1600);}}\n  else v.scrollTop=0;\n}\n\n/* ---------- Eventos ---------- */\nfunction bind(){\n  $$('[data-ic]').forEach(el=>el.insertAdjacentHTML('afterbegin',ic(el.dataset.ic)));\n  $$('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));\n  document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)setView(g.dataset.go);\n    const gd=e.target.closest('[data-guide]');if(gd){const t=gd.dataset.guide;if(t==='channel'){const id=S.single.preset;id==='custom'?openGuide('channels'):openGuide('channels','g-ch-'+id);}else openGuide(t);}});\n  $('#gSeg').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b){S.guideTab=b.dataset.g;renderGuide();$('#view-guide').scrollTop=0;persist();}});\n  $('#gBody').addEventListener('click',e=>{const u=e.target.closest('[data-use]');if(u){setView('single');applyPreset(u.dataset.use);toast('Modelo aplicado');}if(e.target.closest('[data-gtpl]'))$('#bTpl').click();});\n  $('#topActions').addEventListener('click',e=>{const a=e.target.closest('[data-top]');if(!a)return;\n    if(a.dataset.top==='clear')clearSingle();\n    if(a.dataset.top==='clearHist'&&confirm('Apagar todo o histórico de links?')){S.history=[];renderHistory();persist();toast('Histórico apagado');}});\n\n  // Individual\n  $('#urlIn').addEventListener('input',e=>{S.single.url=e.target.value;update();persist();});\n  $('#view-single').addEventListener('input',e=>{const k=e.target.dataset.k;if(k){S.single.f[k]=e.target.value;update();persist();}});\n  ddS=Dropdown($('#ddSingle'),{get:()=>S.single.preset,set:id=>applyPreset(id)});\n  ddM=Dropdown($('#ddMulti'),{multi:true,get:()=>S.multi.channels,set:v=>{S.multi.channels=v;renderMulti();persist();}});\n  $('#dynSw').addEventListener('change',e=>{S.single.dynamic=e.target.checked;applyPreset(S.single.preset);});\n  $('#addCustom').addEventListener('click',()=>{S.single.custom.push({id:uid(),k:'',v:''});renderCustom();update();persist();const ins=$$('#customRows [data-c=\"k\"]');ins[ins.length-1].focus();});\n  $('#customRows').addEventListener('input',e=>{const row=e.target.closest('[data-cid]');const c=S.single.custom.find(x=>x.id===row.dataset.cid);if(c&&e.target.dataset.c){c[e.target.dataset.c]=e.target.value;update();persist();}});\n  $('#customRows').addEventListener('click',e=>{if(!e.target.closest('[data-cdel]'))return;const id=e.target.closest('[data-cid]').dataset.cid;S.single.custom=S.single.custom.filter(x=>x.id!==id);renderCustom();update();persist();});\n  $('#outMode').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){S.outMode=b.dataset.m;update();persist();}});\n  $('#copyBtn').addEventListener('click',copySingle);\n  $('#miniCopy').addEventListener('click',copySingle);\n  $('#openBtn').addEventListener('click',()=>{if(cur.valid)window.open(cur.r.url,'_blank','noopener');});\n  $('#shareBtn').addEventListener('click',async()=>{if(!cur.valid)return;try{await navigator.share({url:cur.r.url,title:norm(S.single.f.utm_campaign)||'Link da campanha'});addHistory();}catch(e){}});\n  $('#toQR').addEventListener('click',()=>{if(cur.valid){addHistory();openQR(cur.r.url);}else{toast('Gere um link primeiro','err');}});\n  document.addEventListener('keydown',e=>{if(S.view==='single'&&(e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();copySingle();}if(e.key==='Escape'&&!$('#pasteSheet').hidden)closeSheet();});\n\n  // Lote\n  const bindM=(sel,key)=>$(sel).addEventListener('input',e=>{S.multi[key]=e.target.value;persist();});\n  bindM('#mUrl','url');bindM('#mCamp','campaign');bindM('#mCont','content');\n  $('#mDyn').addEventListener('change',e=>{S.multi.dynamic=e.target.checked;persist();});\n  $('#bTpl').addEventListener('click',()=>{\n    const rows=[['url','utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id'],\n      ['https://seusite.com.br/oferta','google','cpc','black_friday_2026','anuncio_texto','tenis corrida','bf26'],\n      ['https://seusite.com.br/oferta','instagram','social','black_friday_2026','story','',''],\n      ['https://seusite.com.br/oferta','newsletter','email','black_friday_2026','botao_topo','',''],\n      ['https://seusite.com.br/oferta','whatsapp','social','black_friday_2026','lista_vip','','']];\n    download('modelo-utm-lote.csv',new Blob(['\\ufeff'+rows.map(r=>r.join(';')).join('\\r\\n')],{type:'text/csv;charset=utf-8'}));\n    toast('Modelo CSV baixado');\n  });\n  $('#mAdd').addEventListener('click',addMulti);\n  const tb=$('#rows');\n  tb.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const tr=e.target.closest('tr');const r=S.rows.find(x=>x.id===tr.dataset.id);if(!r)return;r[k]=e.target.value;tr.querySelector('.res').innerHTML=resHTML(r);updateCount();persist();});\n  tb.addEventListener('change',e=>{if(!e.target.matches('[data-pre]'))return;const r=S.rows.find(x=>x.id===e.target.closest('tr').dataset.id);if(!r)return;const p=P[e.target.value];r.preset=e.target.value;\n    if(p){ORDER.forEach(k=>{if(isMacro(r[k]))r[k]=''});Object.assign(r,p.v);if(p.dyn&&S.multi.dynamic)Object.entries(p.dyn).forEach(([k,v])=>{if(!r[k])r[k]=v});}\n    renderRows();persist();});\n  tb.addEventListener('click',async e=>{\n    const tr=e.target.closest('tr');if(!tr)return;const r=S.rows.find(x=>x.id===tr.dataset.id);if(!r)return;\n    const cp=e.target.closest('[data-copy]');const a=e.target.closest('[data-act]');const c=rowCompute(r);\n    if(cp||(a&&a.dataset.act==='copy')){if(!c.ok){toast('Complete a linha primeiro','err');return;}toast(await copyText(c.url)?'Link copiado':'Não foi possível copiar',undefined);return;}\n    if(!a)return;\n    if(a.dataset.act==='qr'){if(!c.ok){toast('Complete a linha primeiro','err');return;}openQR(c.url);}\n    if(a.dataset.act==='trash'){S.rows=S.rows.filter(x=>x.id!==r.id);renderRows();persist();}\n  });\n  tb.addEventListener('paste',e=>{\n    const inp=e.target.closest('input[data-k]');if(!inp)return;\n    const text=(e.clipboardData||window.clipboardData).getData('text');\n    if(!/[\\t\\n]/.test(text.replace(/\\s+$/,'')))return;\n    e.preventDefault();\n    const grid=parseDelimited(text,text.includes('\\t')?'\\t':'\\u0000');\n    const sr=S.rows.findIndex(x=>x.id===inp.closest('tr').dataset.id),sc=BCOLS.findIndex(c=>c[0]===inp.dataset.k);\n    let n=0;\n    grid.forEach((cells,ri)=>{let row=S.rows[sr+ri];if(!row){row=newRow();S.rows.push(row);}cells.forEach((v,ci)=>{const col=BCOLS[sc+ci];if(col)row[col[0]]=v;});n++;});\n    renderRows();persist();toast(`${n} ${n===1?'linha colada':'linhas coladas'}`);\n  });\n  $('#bAdd').addEventListener('click',()=>{const last=S.rows[S.rows.length-1];S.rows.push(newRow(last?{url:last.url,utm_campaign:last.utm_campaign}:{}));renderRows();persist();const ins=$$('#rows tr:last-child input[data-k=\"utm_source\"]');if(ins[0])ins[0].focus();});\n  $('#bClear').addEventListener('click',()=>{if(S.rows.length&&confirm(`Remover as ${S.rows.length} linhas da tabela?`)){S.rows=[];renderRows();persist();toast('Tabela limpa');}});\n  $('#bCopy').addEventListener('click',async()=>{const x=readyRows();if(await copyText(x.map(v=>v.c.url).join('\\n')))toast(`${x.length} links copiados`);});\n  $('#bCopyTable').addEventListener('click',async()=>{const x=readyRows();const tsv=[HEAD].concat(x.map(rowVals)).map(r=>r.map(c=>String(c).replace(/[\\t\\n]/g,' ')).join('\\t')).join('\\n');if(await copyText(tsv))toast('Tabela copiada. Cole na planilha');});\n  $('#bCsv').addEventListener('click',()=>{const x=readyRows();const q=c=>/[;\"\\n]/.test(c)?'\"'+String(c).replace(/\"/g,'\"\"')+'\"':c;const csv='\\ufeff'+[HEAD].concat(x.map(rowVals)).map(r=>r.map(q).join(';')).join('\\r\\n');download(`utm-lote-${today()}.csv`,new Blob([csv],{type:'text/csv;charset=utf-8'}));toast('CSV baixado');});\n  $('#bPaste').addEventListener('click',()=>{$('#pasteSheet').hidden=false;$('#sheetText').value='';setTimeout(()=>$('#sheetText').focus(),50);});\n  $('#sheetCancel').addEventListener('click',closeSheet);\n  $('#pasteSheet').addEventListener('click',e=>{if(e.target.id==='pasteSheet')closeSheet();});\n  $('#sheetOk').addEventListener('click',()=>{const n=importData($('#sheetText').value);if(n){closeSheet();toast(`${n} ${n===1?'linha importada':'linhas importadas'}`);}});\n  $('#bFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const n=importData(rd.result);if(n)toast(`${n} linhas importadas`);};rd.readAsText(f,'utf-8');e.target.value='';});\n\n  // QR\n  let raf;const rq=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{renderQR();persist();});};\n  $('#qrText').addEventListener('input',e=>{S.qr.text=e.target.value;rq();});\n  $('#qrSize').addEventListener('input',e=>{S.qr.size=+e.target.value;rq();});\n  $('#qrMargin').addEventListener('input',e=>{S.qr.margin=+e.target.value;rq();});\n  $('#qrEcl').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){S.qr.ecl=b.dataset.v;rq();drawMini();}});\n  $('#qrStyle').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){S.qr.style=b.dataset.v;rq();drawMini();}});\n  $('#qrFg').addEventListener('input',e=>{S.qr.fg=e.target.value;rq();drawMini();});\n  $('#qrBg').addEventListener('input',e=>{S.qr.bg=e.target.value;rq();drawMini();});\n  $('#qrTr').addEventListener('change',e=>{S.qr.transparent=e.target.checked;rq();});\n  $('#qrUseLast').addEventListener('click',()=>{const u=lastUrl||(S.history[0]&&S.history[0].url);if(!u){toast('Nenhum link gerado ainda','err');return;}S.qr.text=u;$('#qrText').value=u;rq();});\n  const qrName=()=>'qrcode-'+slug(S.qr.text);\n  $('#qrPng').addEventListener('click',()=>{if(!qrModelCur)return;$('#qrCanvas').toBlob(b=>{download(qrName()+'.png',b);toast('PNG baixado');},'image/png');});\n  $('#qrSvg').addEventListener('click',()=>{if(!qrModelCur)return;download(qrName()+'.svg',new Blob([qrSVG(qrModelCur,S.qr)],{type:'image/svg+xml'}));toast('SVG baixado');});\n  $('#qrCopy').addEventListener('click',()=>{if(!qrModelCur)return;if(!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write){toast('Seu navegador não copia imagens. Use Baixar PNG','err');return;}\n    $('#qrCanvas').toBlob(async b=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Imagem copiada');}catch(e){toast('Não foi possível copiar a imagem','err');}},'image/png');});\n\n  // Histórico\n  $('#histList').addEventListener('click',async e=>{\n    const a=e.target.closest('[data-act]');if(!a)return;const it=e.target.closest('[data-hid]');const h=S.history.find(x=>x.id===it.dataset.hid);if(!h)return;\n    if(a.dataset.act==='copy'){if(await copyText(h.url))toast('Link copiado');}\n    if(a.dataset.act==='qr')openQR(h.url);\n    if(a.dataset.act==='trash'){S.history=S.history.filter(x=>x.id!==h.id);renderHistory();persist();}\n    if(a.dataset.act==='edit'){S.single.url=h.raw||h.url.split('?')[0];S.single.f=Object.assign(blankF(),h.f||{});S.single.custom=(h.custom||[]).map(c=>Object.assign({},c,{id:uid()}));S.single.preset=P[h.preset]?h.preset:'custom';syncSingle();renderPresets();update();setView('single');toast('Link carregado para edição');}\n  });\n}\nfunction closeSheet(){$('#pasteSheet').hidden=true;}\n\n/* ---------- Início ---------- */\nbuildSingleForm();\nbind();\nrenderFmt();\nsyncSingle();\nrenderPresets();\nif(S.single.f.utm_platform)delete S.single.f.utm_platform;\n$('#advBox').open=ADV.some(a=>S.single.f[a.k]);\nrenderMulti();\nrenderRows();\nrenderHistory();\nrenderGuide();\n$('#qrText').value=S.qr.text;$('#qrSize').value=S.qr.size;$('#qrMargin').value=S.qr.margin;$('#qrFg').value=S.qr.fg;$('#qrBg').value=S.qr.bg;$('#qrTr').checked=S.qr.transparent;\nupdate();\nrenderQR();\nsetView(S.view);\nwindow.addEventListener('load',()=>{renderQR();drawMini();});\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};
